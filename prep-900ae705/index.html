:first-child{border-top:0}.rrow:hover{background:var(--soft)}.rl{font-weight:700}.rb,.rb i{border-radius:4px}.rb{height:8px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}.rb i{display:block;height:100%;background:var(--ink)}.rv{font-size:.9375rem;color:var(--muted);font-variant-numeric:tabular-nums}@media (max-width:620px){.rrow{grid-template-columns:1fr auto;gap:6px 12px}.rb{grid-column:1/-1;order:3}.rv{text-align:right;font-size:.875rem}}.timer{display:grid;grid-template-columns:132px minmax(0,1fr);gap:22px;align-items:center;margin-top:24px}.ring,.timer-in{grid-area:1/1}.timer-in{place-self:center;text-align:center;line-height:1.1}.timer-side{grid-area:1/2}.ring .rp,.ring .rt{fill:none;stroke:var(--soft);stroke-width:9}.ring .rp{stroke:var(--yellow);stroke-linecap:round;transition:stroke-dashoffset .3s linear}.ring.over .rp{stroke:var(--stop)}.timer .clock{font-size:2.125rem}@media (max-width:520px){.timer{grid-template-columns:1fr;justify-items:start}.timer-side{grid-area:2/1}}.prefs{margin-top:14px;display:grid;gap:0;max-width:68ch}.prefs .check{padding:5px 0}.recdot{color:var(--stop);font-weight:700;display:inline-flex;align-items:center;gap:8px}.recdot[hidden]{display:none}.recdot::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--stop)}@media (prefers-reduced-motion:no-preference){.recdot::before{animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}}.playback{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px;padding:12px 14px;background:var(--soft);border:1px solid var(--line);border-radius:6px}.playback audio{height:36px;max-width:100%;flex:1 1 220px}.draft summary{padding:10px 0}.wc .over{color:var(--stop);font-weight:600}.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:0 18px}.grid2 .field:last-child{grid-column:1/-1}.spark{color:var(--ink);margin-top:2px}.primer{display:grid;grid-template-columns:repeat(auto-fit,minmax(mi <script>
const C={nav:[["overview","Overview"],["role","Role and process"],["primer","Product primer"],["answers","My answers"],["mock","Mock interview"],["tests","Assessment practice"],["scenarios","Sales scenarios"],["quiz","Knowledge check"],["day","Interview day"]],tabs:[["overview","Plan"],["answers","Answers"],["mock","Mock"],["tests","Tests"]],job:[["Title","Sales Account Manager, Philadelphia. Job ID R266912."],["Pay","$80,000 to $120,000 a year. The posting also lists a bonus program, sales contests and top-performer incentives."],["Responsibilities","Manage and grow existing accounts, and prospect for new business. Build solutions from a range of 43,000 products."],["Schedule","Monday is for planning and scheduling. Tuesday through Friday is on-site customer visits."],["Team","Part of the Allentown, PA sales team, with regular trips to that office for training and department meetings."],["Training","Four weeks of Uline sales training, followed by a 12-week mentorship."],["Requirements","Bachelor’s degree. Five or more years of sales experience preferred. Strong written and verbal communication, problem-solving and presentation skills. Valid driver’s license and a good driving record."],["Benefits","Health insurance, 401(k) with a 6% employer match from day one, paid holidays and time off, phone and internet allowance, mileage reimbursement."],["Screening","All new hires complete a pre-employment hair-follicle drug screen."]],competencies:[["New business","An account or deal that exists because you pursued it. Be ready to explain how you chose the prospect and what you did after the first refusal."],["Account growth","A customer who bought more because you identified a need. Know the starting figure, the ending figure and the time period."],["Territory planning","How you plan a week, group visits, and keep up with follow-ups without being reminded."],["Accuracy","Examples of getting quantities, prices, addresses and commitments right. The timed tests measure the same thing."]],processIntro:"Uline does not publish its interview process. This outline is compiled from candidate reports on Glassdoor for Uline sales roles at other branches, dated 2012 to 2026. The reports agree with each other on most points, but none comes from the Philadelphia team, so confirm the details with your recruiter.",process:[["Phone screen with HR","Often within hours of applying, and about 20 minutes long. Expect “Why Uline?”, “Why sales?” and a walk through your résumé."],["Online assessments","Sent by email. Candidates describe work-style or personality profiles, a sales profile and a writing test. Several also received Word and Excel proficiency tests."],["Application paperwork","A detailed application covering your full work history and supervisor contacts, with consent forms for background checks and drug screening."],["On-site visit","Two timed tests of about four minutes each, one on number matching and one on number patterns. Interviews with sales reps and sales managers follow, sometimes back to back. Candidates report business professional dress, meaning a suit."],["Further interview","A longer conversation with a sales manager or branch manager, in person or by video."],["Ride-along","Half a day in the field with a current rep."],["References and screening","Reference checks, proof of your degree, and the drug screen. One candidate was asked for two supervisors and one coworker."]],processNote:"One candidate for this same job title in New York completed every stage and was then turned down because the corporate sales team had concerns about their job history. Be ready to explain each move on your résumé, with dates and your reason for leaving.",reported:["Why do you want to work at Uline? Why sales?","Describe a typical day in your current job.","What would you prioritize on a sales day: current customers or new business?","How would you learn our product range and keep your knowledge current?","What does it take to succeed in outside sales?","What is your greatest strength?"],recruiterAsk:"Thank you for arranging this. To help me prepare, could you confirm:\n1. Who I will be meeting, and how long I should plan for\n2. Whether the interview is in person, by phone or by video, and the location\n3. Whether there are any assessments, and whether a calculator or scratch paper is permitted\n4. Anything I should bring or complete beforehand",company:["Uline distributes shipping, packaging and industrial supplies to businesses: boxes, tape, stretch wrap, labels, shelving, janitorial and safety products. The posting cites 43,000 products; the company website says over 45,000.","Liz and Dick Uihlein founded the company in 1980, working from their basement. Their first product, the H-101 carton sizer, is still in the catalog. Uline remains family-owned.","Headquarters is in Pleasant Prairie, Wisconsin. The Pennsylvania branch, at 700 Uline Way in Allentown, serves the New York and Philadelphia markets.","The posting describes more than 10,000 employees across 15 locations and 17 sales offices.","Orders placed by 6 p.m. ship the same day, and the company states that 99.5% of orders do. This is a commitment about when an order leaves the warehouse. The delivery date depends on the destination and carrier.","Customers know Uline for its printed catalog of about 900 pages and for keeping items in stock."],pay:["The posting gives a range of $80,000 to $120,000 but does not say how it divides between base salary and bonus. It is reasonable to ask how the plan is structured, how the bonus is calculated and paid, and what a typical first year looks like.","Philadelphia’s wage equity ordinance bars covered employers from asking about your current or past pay. They may ask what you expect to earn. Some Uline candidates elsewhere report application forms that ask for salary history. If that comes up, you can leave the field blank or answer with your expectations:"],payLine:"“I would prefer to focus on this role. Given the responsibilities and the posted range, I am looking for ___. Could you explain how base and bonus are structured?”",payFoot:"Decide on the figure in advance. This is general information, not legal advice.",askThem:["What do your strongest first-year reps do in their first 90 days?","How is this territory divided today between existing accounts and new business?","What does the 12-week mentorship involve from week to week?","How do you review a rep’s week, and how is feedback given?","How often is the team in Allentown, and what happens on those days?","How are base salary and bonus structured, and what is typical in year one?","Is there anything in my background you would like me to expand on?","What are the next steps, and what is your timeline?"],sources:[["Uline job posting R266912","https://www.uline.jobs/JobDetails?culture=en&jobid=R266912&jobtitle=Sales-Account-Manager"],["Uline: about the company","https://www.uline.com/Corporate/About_Company"],["Uline: stretch wrap guide","https://www.uline.com/guide/StretchWrapGuides"],["Glassdoor: Uline interview reports","https://www.glassdoor.com/Interview/Uline-Interview-Questions-E26828.htm"],["Glassdoor: Sales Account Manager interviews","https://www.glassdoor.com/Interview/Uline-Sales-Account-Manager-Interview-Questions-EI_IE26828.0,5_KO6,27.htm"],["Glassdoor: Sales Representative interviews","https://www.glassdoor.com/Interview/Uline-Sales-Representative-Interview-Questions-EI_IE26828.0,5_KO6,26.htm"],["Wikipedia: Uline","https://en.wikipedia.org/wiki/Uline"],["Philadelphia wage equity ordinance: FAQs","https://www.phila.gov/media/20210423162135/Wage-equity-ordinance-faqs.pdf"]],examples:[{id:"new",t:"New business won",s:"A customer, deal or project that exists because you pursued it.",core:!0,fu:["How did you choose that prospect?","What did you do after the first refusal?","Which parts were your work, and which were the team’s?"]},{id:"growth",t:"Existing account grown",s:"A customer who bought more because you identified a need.",core:!0,fu:["What was the starting figure, and over what period?","How much of the growth came from price, and how much from volume?","What would have happened without your involvement?"]},{id:"recovery",t:"Customer problem resolved",s:"A complaint or service failure that you owned through to resolution.",fu:["What did you know for certain at the time?","What required another team?","How did you confirm the issue was resolved?"]},{id:"setback",t:"Missed target or lost deal",s:"A result that fell short, and what you changed afterwards.",fu:["What was the target, and what did you achieve?","What specifically did you change?","How do you know the change worked?"]},{id:"coaching",t:"Feedback applied",s:"Critical feedback, the change you made, and evidence that it lasted.",fu:["What did you disagree with at first?","What does the new behavior look like day to day?"]},{id:"organization",t:"Competing priorities managed",s:"A heavy workload, a detail you caught, or a commitment you kept under pressure.",fu:["What system do you use?","What did you deprioritize, and who did you tell?"]}],starFields:[["headline","One-sentence summary","State the result first. Example: “I grew a $40,000 account to $65,000 in ten months by identifying a second product line they were buying elsewhere.”"],["situation","Situation","Two sentences of context: the customer, the time frame, and the state of things when you started."],["task","Task","What you were responsible for, or the goal you set."],["did","Action","The steps you took, in order. Use “I”. This should be the longest part of the answer."],["result","Result","A measurable outcome and the period it covers. Label estimates as estimates."],["credit","Other contributing factors","A price increase, a colleague’s work, an inherited relationship. Interviewers tend to trust a result more when you acknowledge these."],["backup","Second example","A short note on another example of the same kind. Interviewers sometimes ask for one."]],groups:[["Background and motivation",["intro","resume","why","whysales","fit","strength"]],["Track record",["new","grow","numbers","save","miss","coach","detail","data","typicalday"]],["Approach to this role",["prioritize","learn","success","plan90","week","pressure","pipeline","gap"]],["Role-play",["price","web","prospect","trial"]],["Closing",["comp","book","close"]]],prompts:{intro:{q:"Tell me about yourself.",rep:!1,cue:"Use your drafted answer: where you are now, the experience that matters most for this job, and why you want this role. Leave out the full career history; the résumé walkthrough covers that.",fu:["Which single achievement best shows you are ready for this role?","Why now?"],target:90},plan90:{q:"What would your first 90 days in this role look like?",cue:"Build it around what the posting describes: four weeks of training, then a 12-week mentorship. Talk about learning the products and systems, shadowing reps, meeting your accounts, and agreeing priorities with your manager before setting targets.",fu:["What would you want to have achieved by the end of the mentorship?"]},resume:{q:"Walk me through your résumé, including why you left each role.",cue:"Go in order and keep each role to two or three sentences: what you did, one result, why you moved. Reasons for leaving should be brief, factual and consistent with your application.",fu:["There is a gap here. What were you doing?","Which of these roles prepared you best for field sales?"],target:180},why:{q:"Why do you want to work at Uline?",rep:!0,cue:"Connect specifics of the job (a territory, on-site visits, a broad product range, structured training) to work you have done and enjoyed.",fu:["What do you know about how we go to market?","Which part of this job would be new to you?"]},whysales:{q:"Why sales?",rep:!0,cue:"Give a concrete reason drawn from your own experience, with one short example.",fu:["What do you find hardest about selling?"]},fit:{q:"What are you looking for that your current role does not offer?",cue:"Describe what you are moving toward. Avoid criticizing your current employer.",fu:["What would make this job a poor fit for you?"]},strength:{q:"What is your greatest strength?",rep:!0,cue:"Name one strength relevant to field sales and support it with a brief example.",fu:["And a weakness you are working on?"]},new:{q:"Tell me about a customer you won through persistence.",cue:"Use your “new business won” example: how you chose the prospect, what stood in the way, what you did, and the result.",fu:["How did you choose that prospect?","What did you do after the first refusal?","Can you give me a different example?"]},grow:{q:"How have you grown an existing account?",cue:"Use your “existing account grown” example: the need you found, who you worked with, why it made sense for them, and the result.",fu:["What was the baseline, and over what period?","How much was price and how much was volume?","What did you personally do?"]},numbers:{q:"What was your most recent sales target, and what did you achieve?",cue:"Give the period, the target, the actual figure and the percentage. Say which part of the book you inherited and which part you built.",fu:["How much of that was inherited business?","How much was new versus retained?"]},save:{q:"Tell me about a dissatisfied customer and how you handled it.",cue:"Acknowledge the impact on them, establish the facts, take ownership of the follow-up, and confirm the resolution.",fu:["What did you know for certain at the time?","How did you confirm it was fixed?"]},miss:{q:"Describe a target you missed. What did you change?",cue:"State the gap plainly, then the specific change you made and what happened next.",fu:["What was the target and the actual?","What is still not where you want it?"]},coach:{q:"What is the most difficult feedback you have received, and what did you do with it?",cue:"Choose real feedback, describe a concrete change, and give evidence that it lasted.",fu:["What did you disagree with at first?","What would that manager say about you today?"]},detail:{q:"Tell me about a detail you caught that prevented a larger problem.",cue:"Explain how you check your work, why the detail mattered, and what it prevented.",fu:["What is your checking routine?","How do you avoid relying on memory?"]},data:{q:"Tell me about a time you analyzed data to make an improvement.",rep:!0,cue:"Describe the data, what you noticed, the change you made, and the measured effect.",fu:["How did you know the change caused the improvement?"]},typicalday:{q:"Describe a typical day in your current job.",rep:!0,cue:"Describe what you actually do, in order, and why you prioritize it that way. Include how you plan the day and how you follow up.",fu:["What happens when a customer problem disrupts the plan?","Which part of your day contributes most to results?"]},prioritize:{q:"What would you prioritize on a sales day: current customers or new business?",rep:!0,cue:"The role requires both. Explain how you would decide on a given day (urgency, commitments already made, where the growth is) and how you protect time for prospecting.",fu:["Your biggest account calls with a problem during a prospect meeting. What do you do?"]},learn:{q:"How would you learn our product range and keep your knowledge current?",rep:!0,cue:"Be specific: the training and mentorship, the catalog, ride-alongs, starting with the categories your accounts buy most, and asking customers how they use products.",fu:["A customer asks about a product you do not know. What do you say?"]},success:{q:"What does it take to succeed in outside sales?",rep:!0,cue:"Pick two or three factors you can support with your own examples, such as planning, consistent prospecting and follow-through.",fu:["Which of those is your weakest, and what are you doing about it?"]},week:{q:"How would you organize a week in this territory?",cue:"Monday: plan, group visits by geography, and book appointments with a clear purpose. Tuesday to Friday: visits, prospecting between appointments, and same-day notes and follow-ups.",fu:["An urgent issue comes up. Which visit do you drop?","How do you protect time for follow-up?"]},pressure:{q:"Two important customers need you at the same time. What do you do?",cue:"Weigh urgency, consequences and existing commitments, and explain who you would inform. Use a real example if you have one.",fu:["What do you check before you start driving?","What do you say to the customer who has to wait?"]},pipeline:{q:"How do you tell a friendly conversation from a real opportunity?",cue:"A real opportunity has an identified need, a known decision-maker, and an agreed next step with a date.",fu:["What do you log when there is no timeline?"]},gap:{q:"Which part of this role would involve the most learning for you?",cue:"Name a real gap and explain how you plan to close it.",fu:["What is your first step?","How will you know you have improved?"]},price:{q:"Role-play. I am a buyer: “Your prices are higher than what I pay now.”",cue:"Acknowledge the concern. Ask what is being compared: specification, quantity and freight. Then ask what matters to them besides price.",fu:["“I only care about price.”","What if the competitor really is the better fit?"]},web:{q:"Role-play. I am a customer: “I order on your website. Why would I meet with you?”",cue:"Support their use of the website. Offer help it cannot provide, and ask whether any problem in their operation would justify ten minutes.",fu:["“I am busy. Why should I give you ten minutes?”"]},prospect:{q:"Show me how you would open a cold call with a busy buyer.",cue:"State who you are, ask for thirty seconds, give one relevant reason for the call, and ask one question. Do not assume a problem they have not mentioned.",fu:["“Just send me some information.”","When do you stop calling?"]},trial:{q:"A buyer wants to trial a product. How do you turn that into a decision?",cue:"Agree in advance on the baseline, what will be tested, who will judge it, the success measure, and the date you will review results together.",fu:["Who approves the larger order?","What if the results are mixed?"]},comp:{q:"What are your compensation expectations?",cue:"Give a range you can justify, then ask how base and bonus are structured.",fu:["Which part of that is firm?"]},book:{q:"What is the last book you read?",rep:!0,cue:"Answer honestly and briefly. One sentence on what you took from it is enough.",fu:[],target:60},close:{q:"What questions do you have for us?",cue:"Ask two or three questions that relate to doing the job. Listen to the answers and follow up on one.",fu:["Is there anything about your fit that you would like to address before we finish?"]}},runthrough:["intro","resume","why","typicalday","new","grow","prioritize","price","close"],rubric:["Answered the question within the first two sentences","Described my own actions, using “I” rather than “we”","Gave a measurable result with a time frame","Finished within the target time"]};C.convos=[{id:"keystone",name:"Keystone Fulfillment",who:"Dana, operations manager",max:5,brief:"Dana occasionally orders boxes through Uline’s website. You are visiting to introduce yourself.",open:"Honestly, your box prices looked higher than what we pay now. And we already order online when we need something. Why would I need a meeting?",qs:[{id:"need",l:"Is anything in packing causing your team problems at the moment?",r:"Funny you ask. We took on a fragile product last month. My packers are adding extra padding and re-packing a lot of them. I don’t know if it’s the box, the method or the training.",key:"A fragile new product is being over-padded and re-packed."},{id:"comparison",l:"When you compared prices, was it the same box and quantity, with freight included?",r:"Probably not. Someone held an old invoice up against your website. Freight wasn’t in there. So no, I don’t have a real comparison.",key:"The price comparison was not like for like."},{id:"evidence",l:"How much of your volume does that fragile product represent?",r:"We ship about 12,000 orders a month, but the new product is only around 600 of those. And we don’t track packing time or damage for it separately.",key:"Only 600 of 12,000 monthly shipments are affected, and nothing is measured yet."},{id:"method",l:"Could I see how it is packed, and the manufacturer’s requirements?",r:"Sure. My supervisor, Luis, can walk you through it. There’s a spec sheet from the manufacturer we should probably look at first.",key:"Luis can show you the packing line, and there is a manufacturer specification to check."},{id:"decision",l:"If a change made sense, who would need to approve it?",r:"Luis would run any test. Purchasing approves the spend, and that’s Priya. Neither of them has agreed to anything. I could get both on a short call.",key:"Two people are involved: Luis runs any test, and Priya approves spending."},{id:"trial",l:"What would a useful test look like to you?",r:"Measure how we’re doing on the new product now, then compare a couple of options on packing time, material and damage. Anything bigger needs numbers and Priya’s OK.",key:"Dana wants a baseline first, then a small comparison."},{id:"catalog",l:"Would you like me to walk you through our full range?",r:"No. I’ve got one specific packing headache, not a shortage of catalogs.",weak:!0},{id:"switch",l:"If I could beat your current prices, would you move everything to us?",r:"I can’t promise that. And price per box isn’t the whole story for me.",weak:!0}],acts:[{id:"trial",l:"Arrange a short call with Luis and Priya to agree a baseline for the fragile product and a small side-by-side test."},{id:"compare",l:"Ask for the invoice and specifications so you can prepare a like-for-like delivered-price comparison."},{id:"switch",l:"Propose moving the whole account, with savings projected across all 12,000 monthly shipments."},{id:"catalog",l:"Leave a catalog and say you will check back in a few weeks."}],judge(e,t){const o=t=>e.includes(t);return"trial"===t?o("need")?["ok","This fits what Dana told you. You identified the packing problem and proposed a step sized to it: both decision-makers, a baseline, and a small test."+(o("evidence")?"":" You did not learn that only 600 of the 12,000 monthly shipments involve the new product. That figure matters when you estimate the opportunity.")]:["mid","The proposal is reasonable, but you made it without asking what was going wrong in packing. You would be proposing a test without knowing what it should measure."]:"compare"===t?o("need")?["mid","A price comparison is fair, because the original one used an old invoice and left out freight. However, Dana described a packing problem she has not solved, and this next step does not address it. Lead with the problem and offer the comparison alongside it."]:["mid","A price comparison is fair, because the original one used an old invoice and left out freight. You did not ask whether anything in her operation needs fixing, which is where a field rep can offer something the website cannot."]:"switch"===t?["no","Only 600 of the 12,000 monthly shipments involve the problem product, nothing has been measured, and neither decision-maker has agreed to anything. Projecting savings across the whole account overstates the case and puts your credibility at risk."]:["no","Dana said she does not need a catalog, and a follow-up with no purpose or date rarely leads anywhere. She described a specific problem, and the next step should address it."]},model:"Identify the problem (the fragile product), size it accurately (600 shipments, not 12,000), check the manufacturer’s requirements, and bring Luis and Priya into one short conversation to agree a baseline and a small test. Make no claims about savings until there are measurements."},{id:"riverworks",name:"Riverworks Distribution",who:"Marcus, warehouse manager",max:5,brief:"Marcus requested a price through the website last week. You are following up by phone.",open:"We’re happy with our stretch wrap supplier. I only looked at your site because our renewal price went up.",qs:[{id:"need",l:"Have you had any problems with the current wrap, such as damage, re-wrapping or stockouts?",r:"No. Loads are holding and we’ve never run out. I’m not looking to change how we work.",key:"There is no performance problem with the current product."},{id:"comparison",l:"What exactly did you compare: your renewal price against which of ours?",r:"Our invoice is per case. Your site shows per roll. I haven’t checked rolls per case, footage or freight. Truthfully, I don’t know who’s cheaper.",key:"He compared a per-case price with a per-roll price, so neither of you knows which is cheaper."},{id:"usage",l:"What would I need from you to make the comparison like for like?",r:"Purchasing can send the film spec, roll size, our usual quantity and the ship-to. A matched delivered cost would actually be useful.",key:"Purchasing can provide the specification, roll size, quantity and ship-to address."},{id:"decision",l:"Who decides on the renewal, and by when?",r:"Purchasing. That’s Janelle. It’s due in three weeks. If you’ve got a real like-for-like number, I can get you fifteen minutes with her.",key:"Janelle decides, and the renewal is due in three weeks."},{id:"service",l:"What would a new supplier need to get right on delivery?",r:"Pallets land when we need them. “Ships same day” tells me nothing about when it reaches my dock.",key:"He cares about arrival at his dock, not the ship date."},{id:"next",l:"What next step would be worth your time?",r:"Email me a short list of what you need. If the numbers are interesting, Janelle will decide whether we talk again. Don’t book a trial.",key:"He wants a short email and has said he does not want a trial."},{id:"pitch",l:"Could I show you how a trial might uncover hidden savings?",r:"We don’t have a problem to fix. I’d rather understand the price first.",weak:!0},{id:"discount",l:"If I could get you a discount today, would you place an order?",r:"No. We haven’t even confirmed it’s the same film. And I doubt that’s yours to promise.",weak:!0}],acts:[{id:"compare",l:"Email a short list of the information you need, and offer Janelle a like-for-like delivered-cost comparison before the renewal date."},{id:"exit",l:"Accept that nothing is wrong, thank him, and ask whether you may check in before next year’s renewal."},{id:"trial",l:"Book a product trial, on the basis that the current wrap may be causing damage he has not noticed."},{id:"promise",l:"Promise the lowest delivered price and next-day arrival to win the order now."}],judge:(e,t)=>"compare"===t?["ok","This matches what Marcus asked for: an accurate number and no pressure."+(e.includes("decision")?" You also know that Janelle decides and that the renewal is due in three weeks, which sets your deadline.":" You did not find out who decides or when. Janelle in purchasing decides, and the renewal is due in three weeks.")]:"exit"===t?["mid","Stepping back is sometimes the right call, and Marcus would respect it. In this case he does not know which supplier is cheaper, because he compared a per-case price with a per-roll price. A like-for-like comparison would help him whether or not he switches, so a useful next step was available."]:"trial"===t?["no","Marcus said nothing is wrong with the current wrap. Proposing a trial to find a problem he has not reported is likely to end the conversation."]:["no","You cannot commit to a price before confirming the specification, or to an arrival date before an order exists. Marcus also told you that a ship date does not tell him when pallets reach his dock."],model:"Do not look for a problem he has not reported. The opening is the price confusion: per case against per roll, with freight unknown. Get the specification, roll size, quantity and ship-to, prepare a matched delivered cost, and get it to Janelle well before the renewal date."}],C.objections=[{id:"price",t:"“You cost more.”",scene:"A warehouse manager says a competitor’s stretch wrap is cheaper and asks you to match the price. You have not compared roll length, film usage or delivery costs.",o:["Confirm that the specification, quantity and delivered price are comparable before discussing value.","Explain Uline’s service advantages, then ask how much of a premium they would accept.","Ask for their target price and request an exception from your manager."],a:0,fb:["Correct. You cannot defend or match a price until you know what is being compared.","Service may matter to them, but you do not know that yet, and you do not know the prices are comparable.","This discounts against a figure you have not checked."],say:"“Understood. Can we first make sure we are comparing the same thing: the same film, the same roll length, with freight included? Then I would like to hear how the wrap performs on your loads. If there is a real difference we can test it, and if there is not, I will tell you.”",next:"If they reply “I only care about price,” ask whether ten minutes comparing delivered cost on their two or three highest-volume items would be worthwhile. If not, thank them and leave the door open."},{id:"incumbent",t:"“We are happy with our supplier.”",scene:"A purchasing manager has used the same supplier for years and is not looking to change.",o:["Ask whether a second source for one specific item would be useful.","Suggest a full review of their supply spend to confirm the supplier is the best option.","Offer a catalog and ask for a 30-minute meeting."],a:0,fb:["Correct. It respects the existing relationship and asks for something small and specific.","That is a large request of someone who has just said they have no problem.","A meeting request is more likely to be accepted when it is tied to a need."],say:"“That makes sense, and I would not suggest changing something that works. Is there any item where availability or minimum quantities are less reliable? A second source for one item can be useful even if your main supplier stays in place.”",next:"If they reply “No issues at all,” thank them, ask whether you may check in later in the year, and respect the answer."},{id:"delay",t:"“Your delay is costing us.”",scene:"An existing customer calls about an overdue order. You have not yet looked at the order or the carrier status.",o:["Acknowledge the impact, ask what is most urgent, check the status, and agree a time for your next call.","Drive to their site straight away to show commitment.","Send the tracking link so they can follow the shipment themselves."],a:0,fb:["Correct. You take ownership of the communication without promising what you cannot yet confirm.","A visit may help later. At this point the missing piece is information, which you cannot get from the car.","Tracking is useful, but they called because they want someone to take ownership."],say:"“I am sorry. I understand this is disrupting your operation. Tell me what you need most urgently. I will pull up the order now, find out what our options are, and call you back by 2:30, even if I am still working on it.”",next:"If they ask “Can you guarantee it will be here tomorrow?”, tell them what is confirmed, what is not, and when you will know more."},{id:"online",t:"“We already order online.”",scene:"An account buys cartons through the website and sees no reason to meet a salesperson.",o:["Ask whether any operational issue would make a short conversation worthwhile.","Walk them through website features they may not be using.","Ask them to place future orders through you."],a:0,fb:["Correct. It supports the way they already buy and gives them a reason to talk.","They already use the site. A demonstration does not answer the objection.","That makes ordering less convenient for them and offers nothing in return."],say:"“Please keep ordering that way; it is the quickest route. Where I can help is with things the website cannot see, such as recurring damage, a pack-out that takes too long, or an item that is always hard to get. Is anything like that a concern at the moment?”",next:"If they reply “Packing takes too long,” ask them to walk you through a typical order before you suggest any product."},{id:"unknown",t:"“Which exact product should we use?”",scene:"A customer wants a recommendation for a heavy, awkward load with a specific safety requirement. You do not yet know enough to specify a product.",o:["Gather details of the load and the requirement, check the documentation, then recommend.","Recommend the highest-rated item based on the load figure in the catalog.","Suggest a small trial now and address the safety requirement afterwards."],a:0,fb:["Correct. Accuracy matters more than speed here.","A load rating alone does not establish that the product suits the whole application.","A trial should never come before a safety requirement is confirmed."],say:"“I would rather get this right than guess. Tell me about the load, where it is stored and how it is handled, and the exact requirement you need to meet. I will check the specifications, involve our product specialist if needed, and come back to you by Thursday with an option I have verified.”",next:"If they reply “I need an answer now,” be clear about what you can confirm today and what you cannot. Urgency does not justify guessing on a safety question."}],C.cases=[{id:"followup",t:"Writing: follow-up email after a first visit",min:10,scene:"You met Dana at Keystone Fulfillment this morning. She described a fragile product that packers are over-padding and re-packing, about 600 shipments a month. Luis, her supervisor, would run any test, and Priya in purchasing approves spending. Dana agreed to a 20-minute call with both of them next week.",task:"Write the follow-up email to Dana in 150 words or fewer. Several candidates report a writing test in the Uline process. Its format is not known, so a clear business email written against the clock is sensible practice.",checks:["The subject line is specific","I summarized the problem in terms Dana would recognize","I stated the next step, who is responsible, and proposed dates","I made no claims about savings or products that I have not verified","I proofread names, numbers and dates"],model:"Subject: Follow-up on packing for the new fragile product\n\nHi Dana,\n\nThank you for your time this morning. To confirm what I understood: since you added the new fragile product last month, your packers have been adding extra padding and re-packing a number of orders. It affects about 600 shipments a month, and packing time and damage are not yet tracked for that product.\n\nAs agreed, I would like to set up a 20-minute call with you, Luis and Priya to agree how to measure the current process and what a small comparison might look like. Would Tuesday at 10:00 or Wednesday at 2:00 work?\n\nBefore the call I will review the manufacturer’s packing requirements if you can send them over.\n\nBest regards,\n[Name]"},{id:"complaint",t:"Writing: reply to a complaint",min:10,scene:"A customer emails at 8:10 a.m.: “Our order was supposed to ship Monday. It is Wednesday, we have nothing, and we are down to two days of cartons. Nobody has told us anything. What is going on?” You have not yet looked at the order.",task:"Write your first reply in 120 words or fewer. You do not yet know the cause or the new delivery date.",checks:["I acknowledged the impact on their operation","I said what I know and what I do not yet know","I committed to a specific time for my next update","I did not blame the carrier, the warehouse or the customer","I did not promise a delivery date I cannot confirm"],model:"Subject: Your carton order: update by 10:00 today\n\nHi [Name],\n\nI am sorry. You should have heard from us before now, and I understand that two days of stock leaves you very little room.\n\nI am checking the order and the carrier status now. I do not yet know the cause or the new delivery date, and I will not guess. I will call you by 10:00 this morning with what I have found and the options, including whether we can expedite part of the order to cover your immediate need.\n\nIf it is easier to reach you at a different number, please let me know.\n\nBest regards,\n[Name]"},{id:"growth",t:"Explain a growth figure",min:6,scene:"An account did $400,000 last year and $460,000 this year. Every unit price rose 10%, and the product mix did not change. You arranged three meetings with the buyer during the year, but nobody measured what those meetings led to.",task:"Write what you would say in 60 to 90 seconds if an interviewer asked, “How much did you grow that account?” Work out both revenue growth and volume growth.",checks:["I gave the period and the 15% revenue growth","I calculated volume growth of about 4.5%, not 5%","I described my actions without claiming all of the growth","I said what I would examine to understand the cause"],model:"“Revenue went from $400,000 to $460,000, which is 15% year over year. Prices rose 10% across the board, so volume growth was about 4.5% (1.15 divided by 1.10). I arranged three meetings with the buyer that year. I cannot show that those meetings caused the increase, so before taking credit I would look at which items grew and what the buyer says drove it.”"},{id:"territory",t:"Prioritize a Tuesday morning",min:6,scene:"An $80,000 account reports an urgent supply interruption, and customer support can start investigating now. A $150,000 account has a fixed 11 a.m. meeting to decide on a need you have already identified. A prospect who might spend $300,000 a year has no appointment and no confirmed need, and is 50 minutes away. A small customer has emailed a non-urgent product question.",task:"Write your first three actions. State what you will check, who you will involve, and what you will tell each person. Then name one new fact that would change your plan.",checks:["I established how serious the interruption is and involved support before deciding whether to drive","I kept the 11 a.m. decision meeting, or deliberately rescheduled it","I did not treat the $300,000 estimate as revenue","I replied to the small customer with a realistic time"],model:"Call the $80,000 account first to establish the impact, the order details and what they need today. Ask support to investigate and commit to a call-back time. Unless they need you on site, keep the 11 a.m. meeting, because a decision is pending. Reply to the small customer with the time by which you will have a verified answer. Phone the prospect to qualify them before spending 100 minutes on the road. The plan would change if the interruption required you on site to coordinate."},{id:"value",t:"Build a value case from assumptions",min:7,scene:"A customer ships 20,000 packages a month. Your alternative packaging adds $0.08 per shipment. For this exercise, assume a fair trial showed damage falling from 2.0% to 1.4%. Each damaged shipment costs the customer $25.",task:"Calculate the net monthly benefit and the break-even point. Then write how you would propose a real trial without presenting these assumed figures as proof.",checks:["Added cost: $1,600 a month. Avoided loss: $3,000","Net benefit: $1,400 a month","Break-even: 64 fewer damaged shipments, a drop of 0.32 percentage points","I kept the assumption separate from what a real trial would need to show"],model:"The extra packaging costs 20,000 × $0.08 = $1,600. A drop of 0.6 percentage points is 120 fewer damaged shipments, worth $3,000, so the net benefit is $1,400 a month. Break-even is $1,600 ÷ $25 = 64 shipments, which means damage falling from 2.0% to 1.68%. “These figures are assumptions. I would suggest running both packs side by side on the same product for a month, with an agreed definition of damage, and basing the decision on your own numbers.”"}],C.otherTests=[["Work-style and personality profiles","Candidates mention DiSC-type and other personality questionnaires. There is nothing to study. Answer honestly and consistently; these questionnaires often repeat a question in different words to check consistency."],["Writing test","Reported by several candidates, with no detail on the format. Practice writing a clear, short business email against the clock. Two exercises are under Sales scenarios, in the Written exercises tab."],["Word and Excel","Reported by several candidates. In Excel, review SUM and AVERAGE, percentage change, sorting and filtering, absolute references and basic cell formatting. In Word, review headings, tables, bullets, and find and replace."]];const Q=(e,t,o,a)=>({c:e,q:t,o:o,w:a});C.quiz=[Q("Company and role","Where is Uline headquartered?",["Pleasant Prairie, Wisconsin","Allentown, Pennsylvania","Waukegan, Illinois","Milwaukee, Wisconsin"],"The headquarters moved to Pleasant Prairie in 2010. Allentown is the branch serving New York and Philadelphia. Waukegan was an earlier headquarters."),Q("Company and role","Who founded Uline, and when?",["Liz and Dick Uihlein, in 1980","The Uihlein family, in 1955","Dick Uihlein and a business partner, in 1992","It was spun out of a paper company in 1980"],"They started the business from their basement. The first product, the H-101 carton sizer, is still sold."),Q("Company and role","Which description of Uline’s business is most accurate?",["A distributor of shipping, packaging and industrial supplies","A manufacturer of corrugated boxes, sold mainly through retailers","A freight carrier that also sells packaging materials","An online marketplace for third-party industrial sellers"],"Uline stocks and distributes products to business customers from its own warehouses."),Q("Company and role","What is Uline’s standard shipping commitment?",["Orders placed by 6 p.m. ship the same day","Orders placed by noon arrive the same day","All orders arrive within two business days","Orders over $300 ship free the next day"],"The company states that 99.5% of orders ship the same day. The commitment concerns when the order leaves the warehouse. Arrival depends on destination and carrier."),Q("Company and role","Which branch supports the Philadelphia territory?",["Allentown, Pennsylvania","Pleasant Prairie, Wisconsin","Newark, New Jersey","Harrisburg, Pennsylvania"],"The Pennsylvania branch is at 700 Uline Way in Allentown, and the posting says you would join the Allentown sales team."),Q("Company and role","How does the posting describe the working week?",["Monday for planning; customer visits Tuesday through Friday","Customer visits Monday through Thursday; Friday in the Allentown office","Three days in the field and two days of phone prospecting","Five days in the field, with planning done in the evenings"],"Be ready to describe how you would use a planning day and how you structure field days."),Q("Company and role","What training does the posting describe?",["Four weeks of sales training, then a 12-week mentorship","Two weeks of classroom training, then a territory","Twelve weeks of training, then a four-week mentorship","Six months in inside sales before moving to the field"],"A realistic 90-day plan for this role is built around that training and mentorship."),Q("Company and role","What does the posting say about education and experience?",["Degree required; five or more years of sales experience preferred","Five years of sales experience required; a degree is preferred","No degree requirement; two years of packaging sales required","A degree and an existing book of business are both required"],"The degree is listed as a minimum requirement. The five years of experience is listed as preferred."),Q("Company and role","Which statement matches the responsibilities in the posting?",["Grow existing accounts and prospect for new business","Win new accounts only; existing accounts belong to inside sales","Manage assigned accounts only; marketing supplies the leads","Support field reps with quotes and order entry"],"The role has two parts, and you need an example for each."),Q("Company and role","The posting gives a range of $80,000 to $120,000. What does it leave unstated?",["How the range divides between base and bonus","Whether the role includes any kind of bonus program","Whether mileage is reimbursed for field travel","Whether the 401(k) includes an employer match"],"The posting mentions a bonus program, mileage reimbursement and a 6% match. It does not say how much of the range is base pay, which makes that a fair question to ask."),Q("Company and role","Which pre-employment requirement is stated in the posting?",["A hair-follicle drug screen","A typing speed test","A physical fitness test","A polygraph"],"The posting states that all new hires complete a hair-follicle drug screen."),Q("Products","A customer wraps uniform pallets of boxes and wants a clear, quiet film so barcodes can be scanned through it. Which type is the usual starting point?",["Cast stretch film","Blown stretch film","Either, since they differ only in price","Neither; they should use strapping"],"Cast film is clearer and quieter to unwind. Blown film is tougher and resists punctures better, which suits irregular or sharp-edged loads."),Q("Products","Film keeps puncturing on irregular loads with sharp corners. What is a sensible response?",["Review the wrapping method, then consider blown or heavier film","Move to a thinner cast film, which stretches further and costs less","Recommend strapping instead of film, without needing to see the load","Explain that some punctures are normal for that kind of load"],"Check the wrapping method first. Blown film offers better puncture resistance for irregular loads."),Q("Products","An item is priced per roll and sold only in cases of four. The customer asks for 10 rolls. What do you do?",["Quote 12 rolls (three cases) and confirm with them","Enter 10 rolls, exactly as the customer requested","Enter 8 rolls (two cases) and suggest they reorder later","Enter 40 rolls, since the unit of sale is a case of four"],"Ten is not a multiple of four. Round up to full cases and tell the customer, so the quantity does not come as a surprise."),Q("Products","What is the fairest way to compare two stretch films?",["Cost per pallet wrapped, under the same conditions","Delivered price per roll, including the freight charge","Price per pound of film, which adjusts for roll size","Film gauge, since thicker film always costs more to use"],"Roll length, pre-stretch and wrapping method all affect how much film a pallet uses, so price per roll can mislead."),Q("Products","A customer asks whether a safety product meets a specific standard. What do you do?",["Check that product’s documentation before answering","Say yes if the catalog category page mentions the standard","Say that most products in the category are compliant","Refer them to the standards body’s website to confirm it"],"Compliance is specific to the product. Do not confirm it from memory or by category."),Q("Products","A customer says they need “a better box.” What do you ask first?",["What they ship, its weight, and what is going wrong now","What they currently pay per box, including freight","Whether they would like to see the heavy-duty corrugated line","How many boxes they use each month, and in which sizes"],"The other questions become useful later. You cannot recommend anything until you understand the application and the failure."),Q("Products","What does ECT measure on a corrugated box?",["Edge crush: how much stacking load the board can take","Burst strength: the pressure needed to puncture the wall","Moisture resistance of the outer liner","The recycled content of the board"],"ECT is the edge crush test and relates to stacking strength. 32 ECT is the common single-wall standard. The older Mullen test measures burst strength."),Q("Products","Box dimensions are listed as 12 × 10 × 8. What do those numbers mean?",["Inside length, width and height, in that order","Outside length, width and height, in that order","Inside height, width and length, in that order","Outside width, length and height, in that order"],"Boxes are specified by inside dimensions, length × width × height, because what matters is what fits."),Q("Products","A customer stores sealed cartons for a year in a warehouse with wide temperature swings. Which tape adhesive suits that best?",["Acrylic","Hot melt","Natural rubber","Any of them; adhesive does not affect storage life"],"Acrylic holds over time and across a wide temperature range. Hot melt grabs quickly and suits general carton sealing. Natural rubber sticks well to recycled or dusty cartons."),Q("Products","Poly bag thickness is given in mils. What is one mil?",["One thousandth of an inch","One millimeter","One hundredth of an inch","One micron"],"A 2 mil bag is a common standard weight, 4 mil is heavy duty and 6 mil is extra heavy."),Q("Products","What is the difference between cushioning and void fill?",["Cushioning absorbs shock; void fill stops items moving in the box","Cushioning is paper-based; void fill is plastic-based","Cushioning is for heavy items; void fill is for light items","There is no practical difference between the two"],"Bubble and foam cushion a product. Kraft paper and air pillows fill empty space. A fragile item often needs both."),Q("Products","A customer needs inventory labels that stay readable for several years. Which print method fits?",["Thermal transfer, which uses a ribbon","Direct thermal, which uses heat-sensitive paper","Either, since both last equally long","Neither; they need laser-printed labels"],"Direct thermal labels fade with heat, light and time, which is fine for a shipping label. Thermal transfer uses a ribbon and lasts much longer."),Q("Products","Which strapping is commonly used in place of steel on heavy palletized loads?",["Polyester","Polypropylene","Twine","Stretch film"],"Polyester holds tension on heavy loads and is safer to handle than steel. Polypropylene suits light to medium bundling. Steel remains the choice for the heaviest, sharp-edged or hot loads."),Q("Sales judgment","A buyer says, “Your price is higher.” What is the best first response?",["Ask what is being compared: specification, quantity, freight","Explain the service advantages that justify the price difference","Ask what price they need, and take that figure to your manager","Offer to match the price on their single highest-volume item"],"Until you know the comparison is like for like, you do not know whether there is a price gap at all."),Q("Sales judgment","A prospect says, “We are happy with our supplier.” What is a good next move?",["Ask whether a second source for one item would help","Ask when their current contract ends, and call back then","Offer a side-by-side review of their whole supply spend","Leave a catalog with them and follow up in about a month"],"A small, specific request is easier to accept than a broad review, and it respects the existing relationship."),Q("Sales judgment","A customer’s order is late and you do not yet know why. What do you do first?",["Call them, ask what is most urgent, check status, and set a call-back time","Wait until you have the full explanation, so that you only need to call once","Send them the carrier’s tracking number and its customer service line","Tell them it should arrive tomorrow, based on normal transit times for the lane"],"Customers tolerate bad news better than silence. Commit to the next update, and do not commit to a date you cannot confirm."),Q("Sales judgment","Your contact likes your proposal but cannot approve purchases. What is the best next step?",["Ask how purchases are approved, and offer to help involve the approver","Email the proposal directly to their manager, which saves everyone time","Log it as a committed deal, since the person using the product supports it","Wait for the contact to come back to you once they have secured approval"],"Work through your contact. Going around them damages the relationship, and waiting leaves the outcome to chance."),Q("Sales judgment","A prospect is friendly and asks for a catalog, but names no need and agrees no next step. How should you forecast it?",["Log the call; forecast nothing until there is a need and a next step","Forecast a small first order, since asking for a catalog shows intent","Forecast their estimated annual spend, at a low probability of closing","Close it out as lost, since no need or next step was agreed"],"Interest is not yet an opportunity. It is worth another conversation, but it should not appear in a revenue forecast."),Q("Sales judgment","You have a fixed prospect appointment in 20 minutes. An existing account calls about a stockout, and support can investigate immediately. What do you do?",["Call the account, start support on it, set a call-back time, and keep the appointment for now","Drive to the account straight away, because existing customers should always come first","Keep the appointment as planned, and deal with the account’s stockout once it is finished","Cancel the appointment and spend the day resolving the stockout with the account in person"],"Establish the facts before you travel. You can protect the account through support and clear communication while keeping your other commitment."),Q("Sales judgment","Which visit note is most useful to you and your manager?",["Need, evidence, decision-makers, next step and date","A full chronological record of what was said in the meeting","The products discussed, and the customer’s reaction to each one","Estimated annual spend, and your probability of winning it"],"A good note lets anyone pick up the account and know what happens next."),Q("Sales judgment","You are calling a business you know little about. Which opening is strongest?",["Say who you are, ask for thirty seconds, give one reason, ask one question","Open with a statistic about packaging waste in their industry, then ask about theirs","Ask for a 30-minute meeting so that you can introduce Uline’s full product range","Ask who handles purchasing, then request their email so you can send a catalog"],"Ask permission, be brief, and do not assume a problem you have not confirmed."),Q("Sales judgment","A buyer agrees that a product trial might help. What makes it lead to a decision?",["Agreeing the baseline, the success measure, who judges it, and a review date","Sending samples promptly and following up with the buyer in two weeks","Quoting the full conversion up front, so they can see the savings at scale","Letting the customer define success once they have used the product for a while"],"A trial without agreed criteria tends to end without a conclusion."),Q("Sales judgment","After a fair comparison, the competitor is cheaper and the buyer has no unmet need. What do you do?",["Say so, thank them, and agree when to check in again","Ask for a small order so that the account shows as active","Request a price exception from your manager to win the business","Propose a product trial to look for performance differences"],"Honesty here costs you one sale and builds the credibility that wins later ones."),Q("Sales judgment","A customer who orders on the website asks why they should meet with you. What is the best response?",["Ask whether any packing or supply problem would justify ten minutes","Offer to place their orders for them, so they have a single point of contact","Show them some website features that they may not be using yet","Set up a regular monthly visit to review their order history with them"],"Support the way they buy, and offer something the website cannot provide."),Q("Sales judgment","No account has an urgent issue. Which one is the best candidate for your next discovery visit?",["A mid-sized account with a stated need and an available buyer","Your largest account, although nobody there is free to meet","The account that happens to be closest to today’s route","An account that has never bought from your strongest category"],"Size and location matter, but a stated need and access to the buyer give you a reason to meet."),Q("Sales judgment","Revenue on your account rose, but you cannot separate your effect from a general increase in the customer’s buying. How do you present it?",["Give the measured change, what you did, and what you cannot attribute","Claim the full increase, since it happened while you managed the account","Leave the number out altogether, since you cannot prove causation","Quote the best single month, which shows your effect most clearly"],"Interviewers probe attribution. A measured claim holds up under follow-up questions, and an inflated one does not."),Q("Sales judgment","A receptionist will not connect you to purchasing. What is the professional next step?",["Ask how purchasing prefers to be contacted, and follow that","Call back at lunchtime, when someone else may answer the phone","Ask a warehouse employee for the buyer’s direct phone line","Send a calendar invitation to your best guess at their email address"],"Working around the gatekeeper tends to cost you the account before you have started."),Q("Numbers","An item costs $75 and sells for $100. What is the gross margin?",["25%","33.3%","75%","20%"],"Margin is profit divided by selling price: $25 ÷ $100. Dividing by cost gives the markup, 33.3%."),Q("Numbers","An item costs $75 and sells for $100. What is the markup on cost?",["33.3%","25%","75%","133.3%"],"Markup is profit divided by cost: $25 ÷ $75. Margin divides by price and gives 25%."),Q("Numbers","A damage rate falls from 2.0% to 1.4%. Which description is correct?",["A 0.6 percentage-point drop, a 30% reduction","A 0.6% reduction in the damage rate","A drop of 6 percentage points in damage","A 70% reduction in the damage rate"],"2.0 minus 1.4 is 0.6 percentage points. Relative to the starting rate, 0.6 ÷ 2.0 is 30%. State which one you mean."),Q("Numbers","An account grows from $400,000 to $460,000. All prices rose 10% and the mix did not change. What was the volume growth?",["About 4.5%","15%","5%","10%"],"Revenue rose 15%. Removing the price effect: 1.15 ÷ 1.10 = 1.045, so volume rose about 4.5%."),Q("Numbers","You contacted 40 prospects, qualified 16, and won 8. How should you report conversion?",["20% of contacted and 50% of qualified","50%, since qualified prospects are the fair base","20%, since contacted prospects are the fair base","35%, the average of the two conversion rates"],"Both rates are valid. A conversion figure without its denominator invites a follow-up question you would rather answer up front."),Q("Numbers","Your quote is $500 plus $65 freight. A competitor’s is $540 plus $10 freight, for the same goods. Which is cheaper delivered?",["The competitor, by $15","Yours, by $40","Yours, by $15","The competitor, by $55"],"$565 against $550. Always compare delivered totals."),Q("Numbers","23 of 80 prospects converted. What is the rate, to one decimal place?",["28.8%","28.7%","28.75%","29.0%"],"23 ÷ 80 = 28.75%, which rounds up to 28.8%."),Q("Interview technique","What does STAR stand for?",["Situation, Task, Action, Result","Summary, Target, Approach, Review","Situation, Timeline, Analysis, Result","Strategy, Task, Action, Reflection"],"It is the standard structure for behavioral interview answers."),Q("Interview technique","In a two-minute STAR answer, which part should take the most time?",["Action","Situation","Task","Result"],"Interviewers are assessing what you did. Keep the situation and task to a few sentences."),Q("Interview technique","You are asked about a target you missed. Which approach is strongest?",["State the gap, your part in it, what you changed, and what followed","Explain the market conditions that caused the target to be missed","Choose a miss where responsibility mainly sat with someone else","Choose a near miss, so that the gap you describe is small"],"The question tests ownership and learning. A real miss with a clear change is more convincing than a minimized one."),Q("Interview technique","You have no directly comparable example for a question. What should you do?",["Use a real example from another setting, and say what differs","Describe in detail what you would do if you faced that situation","Adapt a colleague’s example that you know well enough to describe","Say that you have not faced that situation, and move to the next question"],"A real example that transfers is stronger than a hypothetical. Never present someone else’s work as your own."),Q("Interview technique","How should you approach a work-style or personality questionnaire?",["Answer honestly and consistently","Choose the most assertive option each time","Answer as you imagine the ideal salesperson would","Choose the middle option when unsure"],"These questionnaires often repeat items in different words to check consistency, and an invented persona is hard to maintain."),Q("Interview technique","Which is the strongest final question to ask an interviewer?",["Whether anything in your background gives them pause, then next steps","When you can expect to receive an offer if things go well","How you compare with the other candidates they are seeing","None, as a way of showing respect for the interviewer’s time"],"It gives you a chance to address a concern while you are still in the room.")],C.quiz.forEach(e=>{let t=0;for(const o of e.q)t=31*t+o.charCodeAt(0)>>>0;e.id="q"+t.toString(36)}),C.dayFields=[["when","Date and time","Day, date and time. Plan to arrive 15 minutes early."],["where","Location or video link","Address and entrance, or the meeting link"],["who","Interviewers","Names and titles, if known"],["contact","Recruiter’s name and phone number","In case you are delayed"],["format","Format confirmed by the recruiter","Length, assessments, what to bring. Leave blank until confirmed."]],C.documents=["Several printed copies of your résumé","Full work history with exact dates, and each supervisor’s name and contact details","References. One candidate was asked for two supervisors and one coworker.","A copy of your diploma or transcript","Driver’s license","A notepad and pen"],C.before=["Time, location and recruiter contact confirmed","Route checked, or video link tested","Business professional outfit ready (candidates report that a suit is expected)","Documents packed","Both main examples rehearsed aloud once","Three questions chosen","Phone charged"],C.morning=["Plan to arrive 15 minutes early.","On the timed tests, read the instructions fully before you start. Candidates say you are not expected to finish, so work accurately.","If you need a moment before answering, say so. A short pause is normal in a structured interview.","Expect several conversations in a row. Give each interviewer a complete answer, even if you covered the same ground with the previous one."],C.ridealong=["Treat it as part of the interview. The rep will be asked for their impression of you.","Dress as you would for the interview unless told otherwise.","Let the rep lead with customers. Observe, and save your questions for the car.","Useful questions: how they plan their Monday, how they divide time between existing accounts and prospecting, what customers call about most often, and what they found hardest in their first six months.","Afterwards, send a short thank-you to the rep as well as the manager."],C.after=["Write down who you met and what they asked while you still remember it.","Send a short thank-you the same day that refers to something specific from the conversation.","Note anything you promised to send, and send it."],C.phases={foundation:{name:"Foundation",tasks:[["read","Read Role and process","10 min","role"],["intro","Draft “Tell me about yourself” and “Why Uline”","15 min","answers","core"],["star1","Write your new-business example","15 min","answers","star"],["base","Baseline: one number matching round and one number patterns round","10 min","tests"]]},build:{name:"Build",tasks:[["star2","Write your account-growth example","15 min","answers","star"],["resume","Complete the résumé walkthrough","10 min","answers","resume"],["mock3","Mock interview: three questions from Background and motivation","12 min","mock"],["tests","Both timed tests, then review your errors","10 min","tests"],["primer","Read the product primer","8 min","primer"]]},rehearse:{name:"Rehearse",tasks:[["full","Full mock interview","25 min","mock"],["scen","One discovery conversation and one objection","10 min","scenarios","convo"],["write","One timed writing exercise","10 min","scenarios","case"],["quiz","One knowledge check round","5 min","quiz"],["math","One sales math round","6 min","tests"]]},practiceA:{name:"Practice",tasks:[["tests","Both timed tests, then review your errors","10 min","tests"],["mock2","Mock interview: two questions you have not practiced","10 min","mock"],["core","Refine one core answer until it fits the time target","8 min","answers","core"],["quiz","One knowledge check round","5 min","quiz"]]},practiceB:{name:"Practice",tasks:[["star","Write or improve one STAR example","12 min","answers","star"],["scen","One discovery conversation or objection","8 min","scenarios","convo"],["math","One sales math round and one order-entry exercise","10 min","tests"],["mock1","Mock interview: one role-play question","6 min","mock"]]},light:{name:"Light day",tasks:[["logistics","Confirm time, place and contact on the Interview day page","5 min","day"],["docs","Pack your documents and lay out your outfit","10 min","day"],["two","Say your two priority examples aloud, once each","8 min","mock"],["one","One timed round of a test you have already practiced","4 min","tests"],["asks","Choose the three questions you will ask, then stop for the day","3 min","role"]]},day:{name:"Interview",tasks:[["card","Read through your interview day card","5 min","day"],["early","Arrive 15 minutes early","",""],["thanks","Afterwards: write down what was asked and send your thank-you notes","10 min","day"]]},after:{name:"Follow-up",tasks:[["thanks","Send thank-you notes if you have not already","10 min","day"],["record","Write down who you met and what they asked","10 min","overview"]]}},C.core=[{id:"intro",t:"Tell me about yourself",target:90,mock:"intro",g:"Three parts. Where you are now and what you are responsible for. The one or two experiences that matter most for a field sales role. Why you want this job in particular. Most interviews open with this, so it is worth having word for word."},{id:"why",t:"Why Uline?",target:75,mock:"why",rep:!0,g:"Give two or three reasons, and tie each one to something you have done. Useful material: owning a territory, meeting customers on site, a broad product range, structured training and mentorship, a family-owned company with a reputation for service."},{id:"whysales",t:"Why sales?",target:60,mock:"whysales",rep:!0,g:"A concrete reason from your own experience, with one short example. Avoid general statements about liking people."},{id:"typicalday",t:"A typical day in your current job",target:90,mock:"typicalday",rep:!0,g:"Walk through the day in order and explain why you prioritize it that way. Include how you plan and how you follow up. The interviewer is listening for structure and self-management."},{id:"strength",t:"Greatest strength, and a weakness",target:90,mock:"strength",rep:!0,g:"One strength relevant to field sales, with a brief example. One real weakness, what you are doing about it, and evidence that it is improving."},{id:"prioritize",t:"Current customers or new business?",target:60,mock:"prioritize",rep:!0,g:"The role requires both. Explain how you would decide on a given day and how you protect prospecting time when existing accounts are busy."},{id:"learn",t:"How would you learn our products?",target:60,mock:"learn",rep:!0,g:"Be specific: the four weeks of training, the mentorship, the catalog, ride-alongs, starting with the categories your accounts buy most, and asking customers how they use what they buy."}],C.plan90=[["w1","Weeks 1 to 4: training","What you want to learn, and how you will make the most of it. Products, systems, how orders and service work, and how strong reps plan their week."],["w2","Weeks 5 to 16: mentorship","Shadowing, meeting your existing accounts, learning the territory, starting to prospect with your mentor’s guidance, and agreeing priorities with your manager."],["w3","By the end of the mentorship","What you would expect to be doing independently. Avoid promising revenue figures before you have seen the territory’s baseline."]],C.resumeFields=[["role","Employer and title","Keystone Packaging, Account Executive"],["dates","Dates","March 2021 to present"],["did","What you did, in one sentence","Managed 60 accounts across two counties and prospected for new business"],["result","One result","Grew the book from $1.1M to $1.4M in two years"],["left","Reason for leaving","Brief, factual and consistent with your application"]],C.primerIntro="General packaging knowledge, enough to hold a sensible conversation and to answer “How would you learn our products?” with some substance. Uline’s own training will cover its specific range.",C.primer=[{t:"Corrugated boxes",s:"The core of the catalog. The standard shipping box is an RSC, a regular slotted container.",terms:[["Dimensions","Listed as inside length × width × height."],["ECT","Edge crush test. Indicates stacking strength; 32 ECT is the common single-wall standard."],["Mullen or burst test","An older rating of resistance to puncture, such as 200 lb."],["Single and double wall","Double wall adds a second fluted layer for heavier or stacked loads."]],ask:["What goes in the box, and how much does it weigh?","Does it ship by parcel carrier or on a pallet?","What is going wrong with the current box?"]},{t:"Stretch wrap",s:"Film that holds a pallet load together.",terms:[["Cast film","Clear and quiet to unwind. Suits uniform loads."],["Blown film","Tougher, with better puncture resistance and holding force. Suits irregular or sharp-edged loads."],["Gauge","Film thickness. 80 gauge is a common general-purpose hand film."],["Hand and machine film","Machine film is made for stretch wrappers and is not interchangeable with hand rolls."]],ask:["Are the loads uniform or irregular?","Is wrapping done by hand or by machine, and how many pallets a day?","Are loads shifting or is film tearing?"]},{t:"Carton sealing tape",s:"The choice of adhesive matters more than most buyers expect.",terms:[["Hot melt","Strong initial grab. The general-purpose choice for sealing cartons."],["Acrylic","Holds over time and across a wide temperature range. Suits long storage."],["Natural rubber","Sticks to recycled, dusty or cold cartons."],["Water-activated tape","Paper tape that bonds to the carton and shows tampering."],["Mil","Tape thickness. Heavier boxes need a thicker tape."]],ask:["How heavy are the cartons, and how long are they stored?","Is the tape applied by hand or by machine?","Are any seals popping open?"]},{t:"Poly bags",s:"Sold by size, style and thickness.",terms:[["Mil","One thousandth of an inch. 2 mil is standard, 4 mil is heavy duty, 6 mil is extra heavy."],["Styles","Flat, gusseted, and reclosable."],["Special types","Anti-static bags for electronics, and food-grade bags."]],ask:["What goes in the bag, and does it have sharp edges?","Does it need to reclose?","Is there a food-contact or static requirement?"]},{t:"Cushioning and void fill",s:"Two different jobs that are often confused.",terms:[["Cushioning","Absorbs shock. Bubble and foam."],["Void fill","Stops items moving in the box. Kraft paper, air pillows and loose fill."]],ask:["How fragile is the product, and what damage are they seeing?","How fast does the pack-out need to be?","How much storage space do they have for packing material?"]},{t:"Strapping",s:"Secures bundles and heavy pallet loads. Needs matching tools and seals.",terms:[["Polypropylene","Light to medium duty bundling and carton closing."],["Polyester","Heavy palletized loads. Holds tension well and often replaces steel."],["Steel","The heaviest loads, and loads that are sharp-edged or hot."]],ask:["How heavy is the load, and does it settle in transit?","Are they using manual or powered tools?"]},{t:"Labels",s:"Most shipping and inventory labels are thermal printed.",terms:[["Direct thermal","No ribbon. The label darkens with heat, so it fades over time. Standard for shipping labels."],["Thermal transfer","Uses a ribbon. Durable, for inventory and long-term identification."]],ask:["Which printer do they use?","How long does the label need to stay readable, and in what conditions?"]},{t:"Warehouse, janitorial and safety",s:"Shelving, carts, pallet jacks, trash liners, gloves, floor tape, first aid. A large share of account growth comes from these categories.",terms:[["Different buyer","Facility and safety supplies are often bought by someone other than the packaging buyer."]],ask:["Who orders these items today, and from where?","What do they run out of most often?"]}],C.thanksFields=[["name","Interviewer’s first name","Jordan"],["topic","Something specific you discussed","how the team plans territory coverage on Mondays"],["point","One point to reinforce, as a full sentence","My experience growing mid-sized accounts through on-site visits maps closely to what you described."]];
</script>
