<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tomography</title>
  <link href="tomography.css" rel="stylesheet">
  <link href="range-slider.css" rel="stylesheet">
  <link href="https://netdna.bootstrapcdn.com/bootstrap/3.1.1/css/bootstrap.min.css" rel="stylesheet">
</head>
<body onload="genMatricies()">
  <main class="container">
    <div class="row col-xs-12">
      <h1>Tomography</h1>
      <p>Estimate a target from noisy line integral measurements. <a href="tomography_slides.pdf">More.</a></p>
      <div id="newTargetButtonContainer">
        <button type="button" id="newTargetButton" class="new-img btn btn-danger" onclick="newTarget()">New target</button>
      </div>
    </div>

    <img id="hidden_target" src="img/img1.png" alt="">
    <script>
      var numImages = 22;
      var num = Math.floor(Math.random() * numImages) + 1;
      var imageFile = 'img/img' + num + '.png';
      document.getElementById('hidden_target').src = imageFile;
    </script>

    <div id="lineIntegrals-container">
      <strong>Line integrals</strong>
      <div class="demo-container" id="lines-plot"></div>
      <div id="heatmap">
        <img src="img/heatmap.png" alt="Color scale for the line-integral heatmap">
      </div>
      <div id="lineIntegralsButton">
        <label for="numLineInput">Line integral count</label>
        <select id="numLineInput" onchange="showLines(this.value, this.selectedIndex)">
          <option value="500">500</option>
          <option value="1000" selected>1000</option>
          <option value="2000">2000</option>
        </select>
      </div>
    </div>

    <div id="target-container">
      <strong>Reconstruction</strong>
      <div id="lambdaSlider">
        Smoothing parameter λ
        <div class="range-slider" id="lambda-slider"></div>
        <span id="lambdarange">1</span>
        <button type="button" class="new-img btn btn-danger" id="reconstructButton" onclick="tomography(lambda)">Reconstruct target</button>
      </div>
      <div class="demo-container" id="targetReconstruction"></div>
    </div>

    <div id="true-target-container">
      <strong>True target</strong>
      <div id="showTargetButton">
        <button type="button" class="new-img btn btn-danger" id="trueTargetButton" onclick="showTarget()">Show target</button>
      </div>
      <div class="demo-container" id="trueTargetBox"></div>
    </div>
  </main>

  <footer>
    Made for <a href="https://ee103.stanford.edu/">EE103</a>. Source code on <a href="https://github.com/nitromannitol/tomography-visualizer">GitHub</a>.
  </footer>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.0/jquery.min.js"></script>
  <script src="numeric-1.2.6.js"></script>
  <script src="range-slider.js"></script>
  <script src="tomo-linalg.js"></script>
  <script src="tomography.js"></script>
  <script src="jquery.flot.js"></script>
</body>
</html>
