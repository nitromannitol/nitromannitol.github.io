.talk{align-items:center;gap:12px;margin-top:16px}.talk audio{flex:1 1 220px;max-width:100%;height:44px}.clock{font:600 1.5rem/1 var(--mono);font-variant-numeric:tabular-nums;min-width:3.2em}.check{display:flex;gap:12px;align-items:flex-start;margin-top:32px;padding:6px 0;cursor:pointer;color:var(--ink)}.check input{flex:none;width:24px;height:24px;margin:2px 0 0;accent-color:var(--accent)}.fold{margin-top:36px;border-top:1px solid var(--line)}.fold>summary{padding:16px 0;cursor:pointer;font-weight:600;color:var(--muted);min-height:48px}.fold .in{padding:4px 0 8px}.fold .plain{margin-top:14px}.note{background:var(--soft);border-radius:14px;padding:16px 18px;margin-bottom:24px}#export textarea{margin-top:6px;font-size:1rem;min-height:0}#export{margin-top:16px}.testbar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px;color:var(--muted)}.testbar strong{color:var(--ink);font-weight:650}#left{font-family:var(--mono);font-variant-numeric:tabular-nums}.pair,.two{display:grid;gap:10px}.pair>div{font:500 clamp(1.125rem,.9rem + 1.6vw,1.5rem)/1.4 var(--mono);letter-spacing:.03em;padding:16px 10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;-webkit-user-select:none;user-select:none}.pair.sm>div{font-size:1.0625rem;padding:10px}.two{grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.pair>div,.seq{text-align:center;overflow-wrap:anywhere}.seq{font:500 clamp(1.25rem,1rem + 2vw,1.875rem)/1.4 var(--mono);letter-spacing:.02em;padding:10px 0 20px}.seq.sm{font-size:1.125rem;text-align:left;padding:0 0 4px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opt{min-height:64px;border:2px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);font:600 1.25rem/1 var(--mono);cursor:pointer;-webkit-user-select:none;user-select:none}.opt.right{border-color:var(--accent);background:var(--soft)}.opt.chosen{border-style:dashed}.opt[disabled]{cursor:default;opacity:1}.fb{margin-top:16px;color:var(--muted)}.fb.ok{color:var(--accent);font-weight:600}.miss+.miss{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}.miss .meta{margin-top:6px}.tabs{display:none}.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:550;font-size:.9375rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;max-width:calc(100% - 32px);text-align:center}.toast.on{opacity:1;transform:translate(-50%,0)}@media (max-width:700px){#nav,.busy .tabs{display:none}.top-in{padding:12px 18px}main{padding:26px 18px calc(108px + env(safe-area-inset-bottom,0))}.tabs{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}.tabs a{display:flex;align-items:center;justify-content:center;text-align:center;min-height:58px;padding:8px 4px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.8125rem;line-height:1.2;-webkit-user-select:none;user-select:none}.tabs a[aria-current=page]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}.toast{bottom:calc(80px + env(safe-area-inset-bottom,0))}.plan>div{grid-template-columns:1fr;gap:2px}.row .btn{flex:1 1 auto}}@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}@media print{.btn,.check,.fold,.tabs,.toast,.top{display:none!important}body{background:#fff}details.qa{break-inside:avoid}}

<script>
const C={date:"2026-09-25",nav:[["home","Home"],["uline","About Uline"],["answers","Your answers"],["tests","The two tests"]],cards:[["uline","About Uline","A five-minute read: the job, the company in its own words, and how the interview usually goes."],["answers","Your answers","The questions Uline candidates say they were asked. Write your answers, then say them out loud."],["tests","The two tests","Uline gives two short timed tests. They are simple, and a few practice rounds make them familiar."]],plan:{4:"Read About Uline. Write “Tell me about yourself” and “Why Uline?”",3:"Write two or three more answers. Try each test once, without the clock.",2:"Say your answers out loud. One timed round of each test.",1:"Read your answers through once. Lay out what you need for the morning. Stop early.",0:"Your interview."},friday:["Wear a suit. Candidates say business professional dress is expected at every stage.","Bring a few copies of your résumé, your work history with dates and supervisor contacts, and your references. If they sent a paper application, bring it filled in.","Plan to arrive fifteen minutes early. The branch is at 700 Uline Way, Allentown, unless your recruiter says otherwise.","On the two tests, read the instructions fully before you start and work carefully. Candidates say you are not expected to finish.","Afterwards, send a short thank-you note to each person you met."],read:[{t:"The job",p:["The posting, in short:"],l:["Sales Account Manager for the Philadelphia market, part of the Allentown sales team. $80,000 to $120,000 a year, plus a bonus program.","Manage and grow existing accounts, and prospect for new business.","Monday is for planning and scheduling. Tuesday to Friday you visit customers on site.","Four weeks of Uline sales training, then a 12-week mentorship.","They ask for a bachelor’s degree, good written and spoken communication, and a valid driver’s license. Five years of sales experience is preferred, not required."],after:["Uline’s other postings for this job describe the heart of it as “annual customer consultations” with existing accounts, with “legendary customer service” and a sales support team behind you."]},{t:"What reps say the work is like",l:["Most customers already order from the catalog or the website. You visit to build the relationship and to show them what else Uline stocks.","A good visit is mostly listening: you take notes, walk their warehouse, and notice what they buy somewhere else.","It is a structured job. Weeks are planned, notes go in after every visit, and your manager rides along with you regularly. Reps who like structure speak well of the training, the pay and the people.","Pay is salary plus bonuses. Uline’s careers site lists an annual performance bonus, a sales goal bonus and profit sharing."]},{t:"The company, in its own words",l:["Uline distributes shipping, packaging and industrial supplies to businesses: boxes, tape, stretch wrap, labels, shelving, janitorial and safety products. Over 43,000 products in a catalog of about 900 pages.","Liz and Dick Uihlein started it from their basement in 1980, and it is still family-owned. Liz is CEO. Headquarters is in Pleasant Prairie, Wisconsin.","The mission statement ends with delivering every order “with speed, passion and operational excellence.”","The careers site says: “Great service means worrying about the details so our customers don’t have to.”","What they promise customers: a huge range in stock, orders placed by 6 p.m. ship the same day, someone always answers the phone, and any product can be returned within 30 days.","The Allentown branch is one of the busiest in the company. Uline’s posting for the sales manager there says the manager leads 8 to 10 reps, and calls “strong customer relationships built on trust” the foundation of Uline’s sales culture."]},{t:"How the interview usually goes",p:["Uline does not publish its process. This is what candidates for Uline sales jobs at other branches describe. Your recruiter can tell you what applies to you."],l:["A short phone call with HR: why Uline, why sales, and a walk through your résumé.","Some online questionnaires about work style, which have no right answers, and sometimes a short writing sample.","A visit to the branch. It starts with two short timed tests, then conversations with sales managers. Some candidates were shown around the warehouse.","Sometimes a half day riding along with a current rep.","References, and the hair-follicle drug screen the posting mentions."],after:["Candidates describe the conversations as being mostly about your background and why you would be a good fit. One candidate for this same job title called the on-site tests easy. Several describe the interviewers as friendly. They do go through work history carefully, so know your dates and why you made each move."]},{t:"Talking about pay",p:["The posting says $80,000 to $120,000 without saying how much is base salary, so it is fair to ask how base, the sales goal bonus and profit sharing fit together. In Philadelphia, employers may ask what you expect to earn but not what you earn now. If a form asks for salary history, you can leave it blank."]},{t:"Questions you could ask them",l:["How many existing accounts would I take over, and how much of my time should go to prospecting?","What does a good annual consultation look like to you?","What does the 12-week mentorship involve, week to week?","How often is the team together in Allentown?","What are the next steps?"]}],sources:[["Uline job posting R266912","https://www.uline.jobs/JobDetails?culture=en&jobid=R266912&jobtitle=Sales-Account-Manager"],["Uline: why Uline","https://www.uline.com/Corporate/About_Company"],["Uline: mission and history","https://www.uline.com/Corporate/About_History"],["Uline careers: about Uline","https://www.uline.jobs/About-Uline"],["Uline careers: working at Uline","https://www.uline.jobs/Working-At-Uline"],["Glassdoor: Uline interview reports","https://www.glassdoor.com/Interview/Uline-Interview-Questions-E26828.htm"],["Glassdoor and Indeed: reviews by Uline reps","https://www.indeed.com/cmp/Uline/reviews?fjobtitle=Account+Manager"]],first:["intro","why","whysales","typicalday","resume"],more:["grow","new","prioritize","objection","learn","success","motivates","pressure","fiveyears","strength","ask"],q:{intro:{q:"Tell me about yourself.",t:90,h:"Where you are now, the one or two experiences that matter most for this job, and why you want it. Most interviews open with this."},why:{q:"Why do you want to work at Uline?",t:75,h:"Two or three reasons, each tied to something you have done. You could draw on: a territory of your own, visiting customers on site, same-day shipping and a 30-day guarantee you can stand behind, the training and mentorship, a family-owned company, a growing Allentown branch."},whysales:{q:"Why sales?",t:60,h:"A real reason from your own experience, with one short example. Uline describes its sales culture as relationships built on trust, so a story about earning a customer’s trust fits well."},typicalday:{q:"Describe a typical day, or an average week, in your current job.",t:90,h:"Asked at several branches. Walk through it in order and show how you plan, keep track and follow up. Uline reps plan on Monday and visit customers Tuesday to Friday."},resume:{q:"Walk me through your résumé.",t:180,h:"In order, two or three sentences per role: what you did, one result, why you moved on. Keep the dates the same as on your application."},grow:{q:"Tell me about an account you grew.",t:120,h:"The closest match to the job. Who the customer was, what you noticed they needed, what you did, and what changed, with a number and a time period if you have one."},new:{q:"Tell me about a customer you won.",t:120,h:"How you found them, what stood in the way, what you did, and how it turned out."},prioritize:{q:"On a sales day, which comes first: current customers or new business?",t:60,h:"Asked of a candidate for this same job. The posting wants both, so describe how you make room for each."},objection:{q:"What is the biggest objection you hear, and how do you handle it?",t:75,h:"Choose a real one. At Uline the likely ones are price and “we already order online.” A good answer starts by asking what is being compared, before defending anything."},learn:{q:"How would you learn our product range?",t:60,h:"The training and mentorship, the catalog, starting with what your accounts already buy, and asking customers how they use things."},success:{q:"What does it take to succeed in outside sales?",t:60,h:"Two or three things you can back up with your own examples. Planning, regular visits and reliable follow-up match how Uline works."},motivates:{q:"What motivates you?",t:45,h:"Be honest and specific."},pressure:{q:"How do you handle pressure?",t:75,h:"One real example: what you did first, how you kept the details straight, how it ended."},fiveyears:{q:"Where do you see yourself in five years?",t:45,h:"Uline talks a lot about growing careers inside the company, so growing a territory and earning more responsibility there is a natural answer."},strength:{q:"What are your greatest strength and weakness?",t:90,h:"A strength that matters here, such as reliability, attention to detail or building relationships, with an example. A real weakness and what you are doing about it."},ask:{q:"What questions do you have for us?",t:0,h:"Two or three are plenty. There are ideas at the end of About Uline."}},tests:{match:{t:"Number matching",d:"Two entries side by side. Are they exactly the same?"},pattern:{t:"Number patterns",d:"A row of numbers that follows a rule. Which number comes next?"}}};
