-weight:650;line-height:1.3;text-wrap:balance}.ask.sm{font-size:1.1875rem}.stage .talk{margin-top:22px}details.inline{margin-top:18px;border-top:1px solid var(--line);padding-top:4px}details.inline summary{cursor:pointer;font-weight:600;color:var(--muted);padding:10px 0;min-height:44px}details.inline p{color:var(--ink)}.pre,pre.msg{white-space:pre-wrap}pre.msg{font:400 1rem/1.6 var(--font);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;margin:14px 0 0;overflow-wrap:anywhere}.stack{display:grid;gap:10px;margin-top:14px}.opt.text{font:500 1.0625rem/1.45 var(--font);text-align:left;padding:14px 16px;min-height:56px}.who{font-size:.8125rem;font-weight:600;color:var(--muted);margin:14px 0 4px}.who.me{text-align:right}.bubble{background:var(--bg);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:12px 14px;max-width:88%}.bubble.me,.say{background:var(--soft)}.bubble.me{margin-left:auto;border-color:transparent;border-radius:14px 14px 4px 14px}.say{margin-top:14px;padding:14px 16px;border-radius:12px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{min-height:44px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:550 .9375rem/1 var(--font);cursor:pointer}.chip[aria-pressed=true]{background:var(--soft);border-color:var(--accent)}@media (max-width:700px){.ways{grid-template-columns:1fr}.way{min-height:0;padding:22px 18px}.tabs a{font-size:.75rem}.pickrow .btn{flex:1 1 auto}}

const C={nav:[["overview","Overview"],["role","Role and process"],["primer","Uline products"],["answers","My answers"],["mock","Mock interview"],["tests","Assessment practice"],["scenarios","Sales scenarios"],["quiz","Knowledge check"],["day","Interview day"]],tabs:[["overview","Plan"],["answers","Answers"],["mock","Mock"],["tests","Tests"]],job:[["Title","Sales Account Manager, Philadelphia. Job ID R266912."],["Pay","$80,000 to $120,000 a year. The posting also lists a bonus program, sales contests and top-performer incentives."],["Responsibilities","Manage and grow existing accounts, and prospect for new business. Build solutions from a range of 43,000 products."],["Schedule","Monday is for planning and scheduling. Tuesday through Friday is on-site customer visits."],["Team","Part of the Allentown, PA sales team, with regular trips to that office for training and department meetings."],["Training","Four weeks of Uline sales training, followed by a 12-week mentorship."],["Requirements","Bachelor’s degree. Five or more years of sales experience preferred. Strong written and verbal communication, problem-solving and presentation skills. Valid driver’s license and a good driving record."],["Benefits","Health insurance, 401(k) with a 6% employer match from day one, paid holidays and time off, phone and internet allowance, mileage reimbursement."],["Screening","All new hires complete a pre-employment hair-follicle drug screen."]],competencies:[["Annual consultations","Uline’s other Sales Account Manager postings describe the core of the job as “annual customer consultations” with existing accounts. Prepare an example of visiting a customer, learning their operation and growing what they buy."],["New business","The posting also asks you to prospect. Prepare an example of an account that exists because you pursued it."],["A planned week","Monday is for planning and scheduling; Tuesday to Friday is on-site visits. Be ready to describe how you plan a week and keep records of every call."],["Attention to detail","Uline’s careers site says great service means “worrying about the details so our customers don’t have to.” The timed tests check exactly this."]],repsSay:["Most customers already order from the catalog or the website. The rep visits to build the relationship and show what else Uline stocks. One rep called it “customer service on wheels.”","A good visit means listening, taking notes and touring the customer’s warehouse to see what they buy elsewhere.","Notes from every visit are entered on a company device the same day. Several reps mention daily activity reports.","Managers ride along with reps regularly. One rep says at least once a month.","Reps take product-knowledge tests.","Pay is salary plus bonuses. Uline’s careers site lists an annual performance bonus, a sales goal bonus and annual profit sharing. Reps stress that it is not commission.","Reviews are split. Reps praise the training, the pay, the benefits and the people. The most common complaint is close supervision: monitored schedules, required notes and a strict dress code. Decide honestly whether a structured environment suits you, because the interviewers are looking for people it suits."],branch:["The Pennsylvania branch is at 700 Uline Way, Allentown, PA 18106. It was named The Morning Call’s Top Large Employer in 2025 and 2026.","In 2022 a Uline manager told local press that Allentown was one of the busiest branches in the network, with double-digit growth two years running.","Uline opened a 930,000-square-foot East Coast distribution center in Lower Macungie Township in September 2022, its first outside the Midwest, to speed up delivery in the Northeast.","Uline’s posting for the Allentown Sales Manager says that person leads 8 to 10 reps, spends Monday and Friday in the office and Tuesday to Thursday in the field on joint calls. It opens with: “Strong customer relationships built on trust: that’s the foundation of Uline’s sales culture.”","The Allentown team is also hiring a Territory Sales Manager for Lansdale, so the branch is adding reps around Philadelphia."],processIntro:"Compiled from candidate reports for Uline sales roles at other branches. None is from the Allentown team, so confirm the details with your recruiter.",process:[["Phone screen with HR","Often within hours of applying, and about 20 to 30 minutes. Expect “Why Uline?”, “Why sales?”, a walk through your résumé, and whether you have reliable transportation."],["Online assessments","Sent by email. Candidates describe personality or work-style profiles, a sales profile and a writing test. Several also received Word and Excel tests."],["Application paperwork","A detailed paper application covering your full work history and supervisor contacts, with consent forms for background checks and drug screening. One candidate was expected to bring it completed."],["On-site tests","Two timed tests of about four minutes each: number matching and number patterns. One candidate describes a two-minute quiz catching typos at about one item per second."],["On-site interviews","Several people in a row. Candidates mention a sales director (about an hour), a branch manager (up to two hours, including a warehouse tour), and in one case a regional manager, a director and a VP. One candidate’s day lasted four hours. Business professional dress is expected."],["Ride-along","Half a day in the field with a current rep."],["References and screening","Three professional references in one report; two supervisors and a coworker in another. Proof of your degree, and the hair-follicle drug screen."]],processNote:"One candidate for this same job title in New York completed every stage and was then turned down because the corporate sales team had concerns about their job history. Be ready to explain each move on your résumé, with dates and your reason for leaving.",reported:["Why do you want to work at Uline? Why sales?","What experience do you have, and how will it apply to a position with Uline?","Describe a typical day in your current job. What does your average week look like?","What would you prioritize on a sales day: current customers or new business?","What is the biggest objection you face in the sales process?","How would you learn our product range and keep your knowledge current?","What does it take to succeed in outside sales?","What motivates you to do a good job?","How do you handle pressure?","Where do you see yourself in five years?","What are your greatest strength and weakness?"],recruiterAsk:"Thank you for arranging this. To help me prepare, could you confirm:\n1. Who I will be meeting, and how long I should plan for\n2. Whether the interview is in person, by phone or by video, and the location\n3. Whether there are any assessments, and whether a calculator or scratch paper is permitted\n4. Anything I should bring or complete beforehand",company:["Uline distributes shipping, industrial and packaging materials to businesses across North America. It is family-owned.","Liz and Dick Uihlein started it from their basement in 1980. The first product, the H-101 carton sizer, is still sold. Liz Uihlein is CEO and Dick Uihlein is Chairman of the Board.","The mission statement ends with delivering every order “with speed, passion and operational excellence.” The careers site uses the same three words as a heading.","Headquarters is in Pleasant Prairie, Wisconsin. The website lists fifteen locations across North America, including a new distribution center near Boston. The posting gives over 10,000 employees and 17 sales offices.","The catalog runs to about 900 pages. The posting says 43,000 products; the website says over 45,000, with more than 1,700 box sizes.","Uline received the 2026 Distributors Deliver Award from the National Association of Wholesaler-Distributors."],sellingPoints:[["Huge catalog","Over 45,000 products, in stock and ready to ship."],["Customer service","Orders taken 24 hours a day, every day, by phone, fax or online, with a rep always available."],["Same-day shipping","Order by 6 p.m. and it ships the same day. Uline says 99.5% of orders do, with no backorders. This is about when the order leaves the warehouse, not when it arrives."],["Low shipping costs","Fifteen locations keep freight distances short."],["Quality products","Uline-brand products are positioned as the best quality at the best value."],["The Uline guarantee","Try any product for 30 days. If not satisfied, return it for a refund or credit."]],pay:["The posting gives $80,000 to $120,000 and mentions a bonus program, sales goals, contests and top-performer incentives. Uline’s careers site lists an annual performance bonus, a sales goal bonus and profit sharing. Neither says how much of the range is base salary, so ask how the plan is structured and what a typical first year looks like.","Philadelphia’s wage equity ordinance bars covered employers from asking about your current or past pay. They may ask what you expect to earn. Some Uline candidates elsewhere report application forms that ask for salary history. If that comes up, you can leave the field blank or answer with your expectations:"],payLine:"“I would prefer to focus on this role. Given the responsibilities and the posted range, I am looking for ___. Could you explain how base and bonus are structured?”",payFoot:"Decide on the figure in advance. This is general information, not legal advice.",askThem:["How many existing accounts would I take over in this territory, and how much of my time should go to prospecting?","What does a good annual consultation look like to you?","What does the 12-week mentorship involve from week to week?","How often would you or a manager ride along with me, and how is feedback given?","How often is the team in Allentown, and what happens on those days?","How are base salary, the sales goal bonus and profit sharing structured, and what is typical in year one?","Is there anything in my background you would like me to expand on?","What are the next steps, and what is your timeline?"],sources:[["Uline job posting R266912","https://www.uline.jobs/JobDetails?culture=en&jobid=R266912&jobtitle=Sales-Account-Manager"],["Uline: why Uline","https://www.uline.com/Corporate/About_Company"],["Uline: mission and history","https://www.uline.com/Corporate/About_History"],["Uline careers: about Uline","https://www.uline.jobs/About-Uline"],["Uline careers: working at Uline","https://www.uline.jobs/Working-At-Uline"],["Uline posting: Sales Manager, Pennsylvania branch","https://www.themuse.com/jobs/ulineinc/sales-manager-9be1de"],["Uline posting: Dallas sales careers (annual consultations)","https://www.uline.jobs/JobDetails?culture=en&jobid=R264227&jobtitle=Dallas-Area-Sales-Careers-%28Multiple-Openings%29&requestId="],["WFMZ: Uline’s East Coast distribution center","https://www.wfmz.com/news/area/lehighvalley/uline-gives-tour-of-new-distribution-center-in-lower-macungie/article_a8f55686-547d-11ed-ba7b-2fe82ead91ba.html"],["Glassdoor: Uline interview reports","https://www.glassdoor.com/Interview/Uline-Interview-Questions-E26828.htm"],["Glassdoor: Sales Representative interviews","https://www.glassdoor.com/Interview/Uline-Sales-Representative-Interview-Questions-EI_IE26828.0,5_KO6,26.htm"],["Glassdoor: Account Representative interviews","https://www.glassdoor.com/Interview/Uline-Account-Representative-Interview-Questions-EI_IE26828.0,5_KO6,28.htm"],["Glassdoor: “The Sales Position Experience” (rep review)","https://www.glassdoor.com/Reviews/Employee-Review-Uline-E26828-RVW3197017.htm"],["Indeed: Uline Account Manager reviews","https://www.indeed.com/cmp/Uline/reviews?fjobtitle=Account+Manager"],["Philadelphia wage equity ordinance: FAQs","https://www.phila.gov/media/20210423162135/Wage-equity-ordinance-faqs.pdf"]],examples:[{id:"new",t:"New business won",s:"A customer, deal or project that exists because you pursued it.",core:!0,fu:["How did you choose that prospect?","What did you do after the first refusal?","Which parts were your work, and which were the team’s?"]},{id:"growth",t:"Existing account grown",s:"A customer who bought more because you identified a need.",core:!0,fu:["What was the starting figure, and over what period?","How much of the growth came from price, and how much from volume?","What would have happened without your involvement?"]},{id:"recovery",t:"Customer problem resolved",s:"A complaint or service failure that you owned through to resolution.",fu:["What did you know for certain at the time?","What required another team?","How did you confirm the issue was resolved?"]},{id:"setback",t:"Missed target or lost deal",s:"A result that fell short, and what you changed afterwards.",fu:["What was the target, and what did you achieve?","What specifically did you change?","How do you know the change worked?"]},{id:"coaching",t:"Feedback applied",s:"Critical feedback, the change you made, and evidence that it lasted.",fu:["What did you disagree with at first?","What does the new behavior look like day to day?"]},{id:"organization",t:"Competing priorities managed",s:"A heavy workload, a detail you caught, or a commitment you kept under pressure.",fu:["What system do you use?","What did you deprioritize, and who did you tell?"]}],starFields:[["headline","One-sentence summary","State the result first. Example: “I grew a $40,000 account to $65,000 in ten months by identifying a second product line they were buying elsewhere.”"],["situation","Situation","Two sentences of context: the customer, the time frame, and the state of things when you started."],["task","Task","What you were responsible for, or the goal you set."],["did","Action","The steps you took, in order. Use “I”. This should be the longest part of the answer."],["result","Result","A measurable outcome and the period it covers. Label estimates as estimates."],["credit","Other contributing factors","A price increase, a colleague’s work, an inherited relationship. Interviewers tend to trust a result more when you acknowledge these."],["backup","Second example","A short note on another example of the same kind. Interviewers sometimes ask for one."]],groups:[["Reported by Uline candidates",["why","whysales","experience","typicalday","prioritize","objection","learn","success","motivates","pressure","fiveyears","strength","data","book"]],["From the posting",["intro","resume","new","grow","week","numbers","save","detail","plan90"]],["At a Uline customer",["consult","web","price","prospect"]],["Closing",["comp","close"]]],prompts:{why:{q:"Why do you want to work at Uline?",rep:!0,cue:"Use Uline’s own terms and tie each to something you have done: a territory of your own, on-site customer consultations, same-day shipping you can promise with confidence, four weeks of training and a 12-week mentorship, a growing Allentown branch.",fu:["What do you know about how we go to market?","What do you know about our company values?"]},whysales:{q:"Why sales?",rep:!0,cue:"A concrete reason from your own experience, with one short example. At Uline the job is relationship-led, so an example about building trust with a customer fits well.",fu:["What do you find hardest about selling?"]},experience:{q:"What experience do you have, and how will it apply to a position with Uline?",rep:!0,cue:"Match your experience to the posting line by line: managing and growing accounts, prospecting, planning your own week, on-site visits, presenting solutions.",fu:["Which part of this job would be new to you?"]},typicalday:{q:"Describe a typical day in your current job. What does your average week look like?",rep:!0,cue:"Uline plans Monday and visits Tuesday to Friday, and reps log every call. Describe your day in order, show how you plan it, and mention how you record and follow up.",fu:["What happens when a customer problem disrupts the plan?","How do you keep track of what you promised each customer?"]},prioritize:{q:"What would you prioritize on a sales day: current customers or new business?",rep:!0,cue:"The posting asks for both. Uline’s model is built on consultations with existing accounts, with prospecting alongside. Explain how you would protect time for each.",fu:["Your biggest account calls with a problem during a prospect meeting. What do you do?"]},objection:{q:"What is the biggest objection you face in the sales process, and how do you handle it?",rep:!0,cue:"Pick a real one. For Uline the likely ones are price and “we already order online.” Show that you ask what is being compared before you defend anything.",fu:["Give me a time that approach did not work."]},learn:{q:"How would you learn our product range and keep your knowledge current?",rep:!0,cue:"Forty-plus categories and over 43,000 products. Mention the four weeks of training, the mentorship, the catalog, the product tests reps describe, starting with what your accounts buy most, and asking customers how they use products.",fu:["A customer asks about a product you do not know. What do you say?"]},success:{q:"What does it take to succeed in outside sales?",rep:!0,cue:"Pick two or three you can back with examples. Planning, consistent visits and reliable follow-up match how Uline runs its sales team.",fu:["Which of those is your weakest?"]},motivates:{q:"What motivates you to do a good job?",rep:!0,cue:"Be specific and honest. Uline pays salary plus goal-based bonuses and profit sharing, so motivation tied to hitting goals, serving customers well and being part of a team fits.",fu:["What demotivates you?"]},pressure:{q:"How do you handle pressure?",rep:!0,cue:"A real example with a deadline or a demanding customer: what you did first, how you kept details straight, how it ended.",fu:["Tell me about a time it got the better of you."]},fiveyears:{q:"Where do you see yourself in five years?",rep:!0,cue:"Uline promotes its growth and development from within. An answer about growing a territory, mastering the range and earning more responsibility at Uline fits better than an unrelated ambition.",fu:["What would make you leave a job?"]},strength:{q:"What are your greatest strength and weakness?",rep:!0,cue:"One strength that matters in this job (reliability, attention to detail, building relationships) with an example. One real weakness, what you are doing about it, and evidence.",fu:[]},data:{q:"Tell me about a time you analyzed data to make an improvement.",rep:!0,cue:"Describe the data, what you noticed, the change you made, and the measured effect.",fu:["How did you know the change caused the improvement?"]},book:{q:"What is the last book you read?",rep:!0,cue:"Answer honestly and briefly. One sentence on what you took from it is enough.",fu:[],target:60},intro:{q:"Tell me about yourself.",cue:"Use your drafted answer: where you are now, the experience that matters most for this job, and why you want this role.",fu:["Which single achievement best shows you are ready for this role?","Why now?"],target:90},resume:{q:"Walk me through your résumé, including why you left each role.",cue:"Go in order and keep each role to two or three sentences: what you did, one result, why you moved. One candidate for this job title was turned down over job history, so keep reasons brief, factual and consistent with your application.",fu:["There is a gap here. What were you doing?"],target:180},new:{q:"Tell me about a customer you won through persistence.",cue:"Use your “new business won” example.",fu:["How did you choose that prospect?","What did you do after the first refusal?","Can you give me a different example?"]},grow:{q:"How have you grown an existing account?",cue:"Use your “existing account grown” example. This is the closest match to Uline’s annual consultations, so make it your strongest answer.",fu:["What was the baseline, and over what period?","What did you personally do?"]},week:{q:"How would you organize a week in this territory?",cue:"Follow the posting: Monday for planning and scheduling, Tuesday to Friday on site. Group visits by geography, give each visit a purpose, prospect between appointments, and enter notes the same day.",fu:["An urgent issue comes up. Which visit do you drop?","How many visits a day is realistic?"]},numbers:{q:"What was your most recent sales target, and what did you achieve?",cue:"Give the period, the target, the actual figure and the percentage. Say which part of the book you inherited.",fu:["How much of that was inherited business?"]},save:{q:"Tell me about a dissatisfied customer and how you handled it.",cue:"Uline’s postings talk about “legendary customer service.” Show that you acknowledged the impact, got the facts, owned the follow-up and confirmed the fix.",fu:["How did you confirm it was fixed?"]},detail:{q:"Tell me about a detail you caught that prevented a larger problem.",cue:"Uline says great service means worrying about the details so customers don’t have to. Explain how you check your work and what the catch prevented.",fu:["What is your checking routine?"]},plan90:{q:"What would your first 90 days in this role look like?",cue:"Build it around the posting: four weeks of training, then a 12-week mentorship. Learn the products and systems, ride with experienced reps, meet your accounts, and agree priorities with your manager before promising numbers.",fu:["What would you want to have achieved by the end of the mentorship?"]},consult:{q:"Role-play. You are visiting an existing customer for their annual consultation. They buy only boxes from us. Walk me through the visit.",cue:"Reps say the keys are listening, taking notes and touring the warehouse. Ask to walk the floor, look for categories they buy elsewhere (stretch wrap, tape, janitorial, safety, shelving), agree one next step, and log it the same day.",fu:["They say they are too busy for a tour. What now?","What goes in your call notes?"]},web:{q:"Role-play. I am a customer: “I order on your website. Why would I meet with you?”",cue:"Reps say many customers feel this way. Support the website, then offer what it cannot do: a look at their operation, products they did not know Uline stocks, help with a recurring problem.",fu:["“I am busy. Why should I give you ten minutes?”"]},price:{q:"Role-play. I am a buyer: “Your prices are higher than what I pay now.”",cue:"Ask what is being compared: specification, quantity and freight. Then use Uline’s own selling points where they matter to this customer: in stock, ships the same day, no backorders, a 30-day guarantee.",fu:["“I only care about price.”"]},prospect:{q:"Show me how you would open a call with a business that has never bought from Uline.",cue:"Say who you are, ask for thirty seconds, give one relevant reason, ask one question. Most businesses know the catalog, which helps.",fu:["“Just send me a catalog.”"]},comp:{q:"What are your compensation expectations?",cue:"The posting says $80,000 to $120,000. Give a range you can justify, then ask how base, the sales goal bonus and profit sharing are structured.",fu:["Which part of that is firm?"]},close:{q:"What questions do you have for us?",cue:"Ask the questions you chose on the Role and process page. Listen to the answers and follow up on one.",fu:["Is there anything about your fit that you would like to address before we finish?"]}},runthrough:["intro","resume","why","typicalday","grow","prioritize","consult","price","close"],rubric:["Answered the question within the first two sentences","Described my own actions, using “I” rather than “we”","Gave a measurable result with a time frame","Finished within the target time"]};C.convos=[{id:"keystone",name:"Keystone Fulfillment",who:"Dana, operations manager",max:5,brief:"Keystone orders boxes from Uline’s website a few times a year. This is their annual consultation, and your first visit.",open:"Honestly, your box prices looked higher than what we pay now. And we already order online when we need something. Why would I need a meeting?",qs:[{id:"need",l:"Is anything in packing causing your team problems at the moment?",r:"Funny you ask. We took on a fragile product last month. My packers are adding extra padding and re-packing a lot of them. I don’t know if it’s the box, the method or the training.",key:"A fragile new product is being over-padded and re-packed."},{id:"comparison",l:"When you compared prices, was it the same box and quantity, with freight included?",r:"Probably not. Someone held an old invoice up against your website. Freight wasn’t in there. So no, I don’t have a real comparison.",key:"The price comparison was not like for like."},{id:"evidence",l:"How much of your volume does that fragile product represent?",r:"We ship about 12,000 orders a month, but the new product is only around 600 of those. And we don’t track packing time or damage for it separately.",key:"Only 600 of 12,000 monthly shipments are affected, and nothing is measured yet."},{id:"method",l:"Could I walk the packing line and the warehouse with you?",r:"Sure, ten minutes. My supervisor, Luis, can show you the fragile product. You’ll see our stretch wrap and gloves come from two other vendors. Nobody ever told me you carried those.",key:"On the floor: a packing line to look at, and two categories (stretch wrap and gloves) they buy elsewhere without knowing Uline stocks them."},{id:"decision",l:"If a change made sense, who would need to approve it?",r:"Luis would run any test. Purchasing approves the spend, and that’s Priya. Neither of them has agreed to anything. I could get both on a short call.",key:"Two people are involved: Luis runs any test, and Priya approves spending."},{id:"trial",l:"What would a useful test look like to you?",r:"Measure how we’re doing on the new product now, then compare a couple of options on packing time, material and damage. Anything bigger needs numbers and Priya’s OK.",key:"Dana wants a baseline first, then a small comparison."},{id:"catalog",l:"Would you like me to walk you through our full range?",r:"No. I’ve got one specific packing headache, not a shortage of catalogs.",weak:!0},{id:"switch",l:"If I could beat your current prices, would you move everything to us?",r:"I can’t promise that. And price per box isn’t the whole story for me.",weak:!0}],acts:[{id:"trial",l:"Arrange a short call with Luis and Priya to agree a baseline for the fragile product and a small side-by-side test."},{id:"compare",l:"Ask for the invoice and specifications so you can prepare a like-for-like delivered-price comparison."},{id:"switch",l:"Propose moving the whole account, with savings projected across all 12,000 monthly shipments."},{id:"catalog",l:"Leave a catalog and say you will check back in a few weeks."}],judge(e,t){const o=t=>e.includes(t);return"trial"===t?o("need")?["ok","This fits what Dana told you. You identified the packing problem and proposed a step sized to it: both decision-makers, a baseline, and a small test."+(o("evidence")?"":" You did not learn that only 600 of the 12,000 monthly shipments involve the new product. That figure matters when you estimate the opportunity.")]:["mid","The proposal is reasonable, but you made it without asking what was going wrong in packing. You would be proposing a test without knowing what it should measure."]:"compare"===t?o("need")?["mid","A price comparison is fair, because the original one used an old invoice and left out freight. However, Dana described a packing problem she has not solved, and this next step does not address it. Lead with the problem and offer the comparison alongside it."]:["mid","A price comparison is fair, because the original one used an old invoice and left out freight. You did not ask whether anything in her operation needs fixing, which is where a field rep can offer something the website cannot."]:"switch"===t?["no","Only 600 of the 12,000 monthly shipments involve the problem product, nothing has been measured, and neither decision-maker has agreed to anything. Projecting savings across the whole account overstates the case and puts your credibility at risk."]:["no","Dana said she does not need a catalog, and a follow-up with no purpose or date rarely leads anywhere. She described a specific problem, and the next step should address it."]},model:"Ask to walk the floor, which is what Uline reps say makes a visit useful. Identify the problem (the fragile product), size it accurately (600 shipments, not 12,000), note the categories they buy elsewhere, and bring Luis and Priya into one short conversation to agree a baseline and a small test. Log the visit the same day: the need, who decides, the next step and its date."},{id:"riverworks",name:"Riverworks Distribution",who:"Marcus, warehouse manager",max:5,brief:"Marcus requested a price through the website last week. You are following up by phone.",open:"We’re happy with our stretch wrap supplier. I only looked at your site because our renewal price went up.",qs:[{id:"need",l:"Have you had any problems with the current wrap, such as damage, re-wrapping or stockouts?",r:"No. Loads are holding and we’ve never run out. I’m not looking to change how we work.",key:"There is no performance problem with the current product."},{id:"comparison",l:"What exactly did you compare: your renewal price against which of ours?",r:"Our invoice is per case. Your site shows per roll. I haven’t checked rolls per case, footage or freight. Truthfully, I don’t know who’s cheaper.",key:"He compared a per-case price with a per-roll price, so neither of you knows which is cheaper."},{id:"usage",l:"What would I need from you to make the comparison like for like?",r:"Purchasing can send the film spec, roll size, our usual quantity and the ship-to. A matched delivered cost would actually be useful.",key:"Purchasing can provide the specification, roll size, quantity and ship-to address."},{id:"decision",l:"Who decides on the renewal, and by when?",r:"Purchasing. That’s Janelle. It’s due in three weeks. If you’ve got a real like-for-like number, I can get you fifteen minutes with her.",key:"Janelle decides, and the renewal is due in three weeks."},{id:"service",l:"What would a new supplier need to get right on delivery?",r:"Pallets land when we need them. “Ships same day” tells me nothing about when it reaches my dock.",key:"He cares about arrival at his dock, not the ship date."},{id:"next",l:"What next step would be worth your time?",r:"Email me a short list of what you need. If the numbers are interesting, Janelle will decide whether we talk again. Don’t book a trial.",key:"He wants a short email and has said he does not want a trial."},{id:"pitch",l:"Could I show you how a trial might uncover hidden savings?",r:"We don’t have a problem to fix. I’d rather understand the price first.",weak:!0},{id:"discount",l:"If I could get you a discount today, would you place an order?",r:"No. We haven’t even confirmed it’s the same film. And I doubt that’s yours to promise.",weak:!0}],acts:[{id:"compare",l:"Email a short list of the information you need, and offer Janelle a like-for-like delivered-cost comparison before the renewal date."},{id:"exit",l:"Accept that nothing is wrong, thank him, and ask whether you may check in before next year’s renewal."},{id:"trial",l:"Book a product trial, on the basis that the current wrap may be causing damage he has not noticed."},{id:"promise",l:"Promise the lowest delivered price and next-day arrival to win the order now."}],judge:(e,t)=>"compare"===t?["ok","This matches what Marcus asked for: an accurate number and no pressure."+(e.includes("decision")?" You also know that Janelle decides and that the renewal is due in three weeks, which sets your deadline.":" You did not find out who decides or when. Janelle in purchasing decides, and the renewal is due in three weeks.")]:"exit"===t?["mid","Stepping back is sometimes the right call, and Marcus would respect it. In this case he does not know which supplier is cheaper, because he compared a per-case price with a per-roll price. A like-for-like comparison would help him whether or not he switches, so a useful next step was available."]:"trial"===t?["no","Marcus said nothing is wrong with the current wrap. Proposing a trial to find a problem he has not reported is likely to end the conversation."]:["no","You cannot commit to a price before confirming the specification, or to an arrival date before an order exists. Marcus also told you that a ship date does not tell him when pallets reach his dock."],model:"Do not look for a problem he has not reported. The opening is the price confusion: per case against per roll, with freight unknown. Get the specification, roll size, quantity and ship-to, prepare a matched delivered cost, and get it to Janelle well before the renewal date."}],C.objections=[{id:"price",t:"“You cost more.”",scene:"A warehouse manager says a competitor’s stretch wrap is cheaper and asks you to match the price. You have not compared roll length, film usage or delivery costs.",o:["Confirm that the specification, quantity and delivered price are comparable before discussing value.","Explain Uline’s service advantages, then ask how much of a premium they would accept.","Ask for their target price and request an exception from your manager."],a:0,fb:["Correct. You cannot defend or match a price until you know what is being compared.","Service may matter to them, but you do not know that yet, and you do not know the prices are comparable.","This discounts against a figure you have not checked."],say:"“Understood. Can we first make sure we are comparing the same thing: the same film, the same roll length, with freight included? It is in stock and ships the day you order, and you have 30 days to try it. If it is still not the better buy for you, I will tell you.”",next:"If they reply “I only care about price,” ask whether ten minutes comparing delivered cost on their two or three highest-volume items would be worthwhile. If not, thank them and leave the door open."},{id:"incumbent",t:"“We are happy with our supplier.”",scene:"A purchasing manager has used the same supplier for years and is not looking to change.",o:["Ask whether a second source for one specific item would be useful.","Suggest a full review of their supply spend to confirm the supplier is the best option.","Offer a catalog and ask for a 30-minute meeting."],a:0,fb:["Correct. It respects the existing relationship and asks for something small and specific.","That is a large request of someone who has just said they have no problem.","A meeting request is more likely to be accepted when it is tied to a need."],say:"“That makes sense, and I would not suggest changing something that works. Is there any item where availability or minimum quantities are less reliable? A second source for one item can be useful even if your main supplier stays in place.”",next:"If they reply “No issues at all,” thank them, ask whether you may check in later in the year, and respect the answer."},{id:"delay",t:"“Your delay is costing us.”",scene:"An existing customer calls about an overdue order. You have not yet looked at the order or the carrier status.",o:["Acknowledge the impact, ask what is most urgent, check the status, and agree a time for your next call.","Drive to their site straight away to show commitment.","Send the tracking link so they can follow the shipment themselves."],a:0,fb:["Correct. You take ownership of the communication without promising what you cannot yet confirm.","A visit may help later. At this point the missing piece is information, which you cannot get from the car.","Tracking is useful, but they called because they want someone to take ownership."],say:"“I am sorry. I understand this is disrupting your operation. Tell me what you need most urgently. I will pull up the order now, find out what our options are, and call you back by 2:30, even if I am still working on it.”",next:"If they ask “Can you guarantee it will be here tomorrow?”, tell them what is confirmed, what is not, and when you will know more."},{id:"online",t:"“We already order online.”",scene:"An account buys cartons through the website and sees no reason to meet a salesperson.",o:["Ask whether any operational issue would make a short conversation worthwhile.","Walk them through website features they may not be using.","Ask them to place future orders through you."],a:0,fb:["Correct. It supports the way they already buy and gives them a reason to talk.","They already use the site. A demonstration does not answer the objection.","That makes ordering less convenient for them and offers nothing in return."],say:"“Please keep ordering that way; it is the quickest route. Where I can help is with what the website cannot see. If I could walk your floor for ten minutes, I can usually point to a few things you are buying elsewhere that we stock and ship the same day. Would that be worth ten minutes?”",next:"If they reply “Packing takes too long,” ask them to walk you through a typical order before you suggest any product."},{id:"unknown",t:"“Which exact product should we use?”",scene:"A customer wants a recommendation for a heavy, awkward load with a specific safety requirement. You do not yet know enough to specify a product.",o:["Gather details of the load and the requirement, check the documentation, then recommend.","Recommend the highest-rated item based on the load figure in the catalog.","Suggest a small trial now and address the safety requirement afterwards."],a:0,fb:["Correct. Accuracy matters more than speed here.","A load rating alone does not establish that the product suits the whole application.","A trial should never come before a safety requirement is confirmed."],say:"“I would rather get this right than guess. Tell me about the load, where it is stored and how it is handled, and the exact requirement you need to meet. I will check the specifications, involve our product specialist if needed, and come back to you by Thursday with an option I have verified.”",next:"If they reply “I need an answer now,” be clear about what you can confirm today and what you cannot. Urgency does not justify guessing on a safety question."}],C.cases=[{id:"followup",t:"Writing: follow-up email after a first visit",min:10,scene:"You met Dana at Keystone Fulfillment this morning. She described a fragile product that packers are over-padding and re-packing, about 600 shipments a month. Luis, her supervisor, would run any test, and Priya in purchasing approves spending. Dana agreed to a 20-minute call with both of them next week.",task:"Write the follow-up email to Dana in 150 words or fewer. Several candidates report a writing test in the Uline process. Its format is not known, so a clear business email written against the clock is sensible practice.",checks:["The subject line is specific","I summarized the problem in terms Dana would recognize","I stated the next step, who is responsible, and proposed dates","I made no claims about savings or products that I have not verified","I proofread names, numbers and dates"],model:"Subject: Follow-up on packing for the new fragile product\n\nHi Dana,\n\nThank you for your time this morning. To confirm what I understood: since you added the new fragile product last month, your packers have been adding extra padding and re-packing a number of orders. It affects about 600 shipments a month, and packing time and damage are not yet tracked for that product.\n\nAs agreed, I would like to set up a 20-minute call with you, Luis and Priya to agree how to measure the current process and what a small comparison might look like. Would Tuesday at 10:00 or Wednesday at 2:00 work?\n\nBefore the call I will review the manufacturer’s packing requirements if you can send them over.\n\nBest regards,\n[Name]"},{id:"complaint",t:"Writing: reply to a complaint",min:10,scene:"A customer emails at 8:10 a.m.: “Our order was supposed to ship Monday. It is Wednesday, we have nothing, and we are down to two days of cartons. Nobody has told us anything. What is going on?” You have not yet looked at the order.",task:"Write your first reply in 120 words or fewer. You do not yet know the cause or the new delivery date.",checks:["I acknowledged the impact on their operation","I said what I know and what I do not yet know","I committed to a specific time for my next update","I did not blame the carrier, the warehouse or the customer","I did not promise a delivery date I cannot confirm"],model:"Subject: Your carton order: update by 10:00 today\n\nHi [Name],\n\nI am sorry. You should have heard from us before now, and I understand that two days of stock leaves you very little room.\n\nI am checking the order and the carrier status now. I do not yet know the cause or the new delivery date, and I will not guess. I will call you by 10:00 this morning with what I have found and the options, including whether we can expedite part of the order to cover your immediate need.\n\nIf it is easier to reach you at a different number, please let me know.\n\nBest regards,\n[Name]"},{id:"notes",t:"Writing: call notes after a visit",min:6,scene:"You have just finished the annual consultation at Keystone Fulfillment. They buy boxes from Uline. A fragile new product (about 600 shipments a month) is being over-padded and re-packed. They buy stretch wrap and gloves from two other vendors. Luis, the packing supervisor, would run any test; Priya in purchasing approves spending. Dana agreed to a 20-minute call with both next Tuesday at 10:00.",task:"Uline reps say notes from every visit go into a company device the same day. Write this visit’s note in 80 words or fewer, so that a manager or another rep could pick up the account.",checks:["The customer’s need is stated in one line","Categories they buy elsewhere are recorded","Decision-makers are named with their roles","The next step has an owner, a date and a time","No opinions or filler"],model:"Annual consult with Dana (ops mgr). Buys boxes only. New fragile SKU, ~600 shipments/mo, over-padded and re-packed; no damage or pack-time data yet. Buys stretch wrap and gloves from two other vendors; did not know we stock them. Luis (packing supervisor) would run a test; Priya (purchasing) approves spend. Next: 20-min call with Dana, Luis, Priya, Tue 10:00, to agree baseline and a small box/cushioning comparison. To do: review manufacturer pack spec before call; bring stretch wrap and glove options."}],C.otherTests=[["Work-style and personality profiles","Candidates mention DiSC-type and other personality questionnaires. There is nothing to study. Answer honestly and consistently; these questionnaires often repeat a question in different words to check consistency."],["Writing test","Reported by several candidates, with no detail on the format. Practice writing a clear, short business email against the clock. Two exercises are under Sales scenarios, in the Written exercises tab."],["Word and Excel","Reported by several candidates. In Excel, review SUM and AVERAGE, percentage change, sorting and filtering, absolute references and basic cell formatting. In Word, review headings, tables, bullets, and find and replace."]];const Q=(e,t,o,a)=>({c:e,q:t,o:o,w:a});C.quiz=[Q("Company and role","Where is Uline headquartered?",["Pleasant Prairie, Wisconsin","Allentown, Pennsylvania","Waukegan, Illinois","Milwaukee, Wisconsin"],"The headquarters moved to Pleasant Prairie in 2010. Allentown is the branch serving New York and Philadelphia. Waukegan was an earlier headquarters."),Q("Company and role","Who founded Uline, and when?",["Liz and Dick Uihlein, in 1980","The Uihlein family, in 1955","Dick Uihlein and a business partner, in 1992","It was spun out of a paper company in 1980"],"They started the business from their basement. The first product, the H-101 carton sizer, is still sold."),Q("Company and role","Which description of Uline’s business is most accurate?",["A distributor of shipping, packaging and industrial supplies","A manufacturer of corrugated boxes, sold mainly through retailers","A freight carrier that also sells packaging materials","An online marketplace for third-party industrial sellers"],"Uline stocks and distributes products to business customers from its own warehouses."),Q("Company and role","What is Uline’s standard shipping commitment?",["Orders placed by 6 p.m. ship the same day","Orders placed by noon arrive the same day","All orders arrive within two business days","Orders over $300 ship free the next day"],"The company states that 99.5% of orders ship the same day. The commitment concerns when the order leaves the warehouse. Arrival depends on destination and carrier."),Q("Company and role","Which branch supports the Philadelphia territory?",["Allentown, Pennsylvania","Pleasant Prairie, Wisconsin","Newark, New Jersey","Harrisburg, Pennsylvania"],"The Pennsylvania branch is at 700 Uline Way in Allentown, and the posting says you would join the Allentown sales team."),Q("Company and role","How does the posting describe the working week?",["Monday for planning; customer visits Tuesday through Friday","Customer visits Monday through Thursday; Friday in the Allentown office","Three days in the field and two days of phone prospecting","Five days in the field, with planning done in the evenings"],"Be ready to describe how you would use a planning day and how you structure field days."),Q("Company and role","What training does the posting describe?",["Four weeks of sales training, then a 12-week mentorship","Two weeks of classroom training, then a territory","Twelve weeks of training, then a four-week mentorship","Six months in inside sales before moving to the field"],"A realistic 90-day plan for this role is built around that training and mentorship."),Q("Company and role","What does the posting say about education and experience?",["Degree required; five or more years of sales experience preferred","Five years of sales experience required; a degree is preferred","No degree requirement; two years of packaging sales required","A degree and an existing book of business are both required"],"The degree is listed as a minimum requirement. The five years of experience is listed as preferred."),Q("Company and role","Which statement matches the responsibilities in the posting?",["Grow existing accounts and prospect for new business","Win new accounts only; existing accounts belong to inside sales","Manage assigned accounts only; marketing supplies the leads","Support field reps with quotes and order entry"],"The role has two parts, and you need an example for each."),Q("Company and role","The posting gives a range of $80,000 to $120,000. What does it leave unstated?",["How the range divides between base and bonus","Whether the role includes any kind of bonus program","Whether mileage is reimbursed for field travel","Whether the 401(k) includes an employer match"],"The posting mentions a bonus program, mileage reimbursement and a 6% match. It does not say how much of the range is base pay, which makes that a fair question to ask."),Q("Company and role","Which pre-employment requirement is stated in the posting?",["A hair-follicle drug screen","A typing speed test","A physical fitness test","A polygraph"],"The posting states that all new hires complete a hair-follicle drug screen."),Q("Products","A customer wraps uniform pallets of boxes and wants a clear, quiet film so barcodes can be scanned through it. Which type is the usual starting point?",["Cast stretch film","Blown stretch film","Either, since they differ only in price","Neither; they should use strapping"],"Cast film is clearer and quieter to unwind. Blown film is tougher and resists punctures better, which suits irregular or sharp-edged loads."),Q("Products","Film keeps puncturing on irregular loads with sharp corners. What is a sensible response?",["Review the wrapping method, then consider blown or heavier film","Move to a thinner cast film, which stretches further and costs less","Recommend strapping instead of film, without needing to see the load","Explain that some punctures are normal for that kind of load"],"Check the wrapping method first. Blown film offers better puncture resistance for irregular loads."),Q("Products","An item is priced per roll and sold only in cases of four. The customer asks for 10 rolls. What do you do?",["Quote 12 rolls (three cases) and confirm with them","Enter 10 rolls, exactly as the customer requested","Enter 8 rolls (two cases) and suggest they reorder later","Enter 40 rolls, since the unit of sale is a case of four"],"Ten is not a multiple of four. Round up to full cases and tell the customer, so the quantity does not come as a surprise."),Q("Products","What is the fairest way to compare two stretch films?",["Cost per pallet wrapped, under the same conditions","Delivered price per roll, including the freight charge","Price per pound of film, which adjusts for roll size","Film gauge, since thicker film always costs more to use"],"Roll length, pre-stretch and wrapping method all affect how much film a pallet uses, so price per roll can mislead."),Q("Products","A customer asks whether a safety product meets a specific standard. What do you do?",["Check that product’s documentation before answering","Say yes if the catalog category page mentions the standard","Say that most products in the category are compliant","Refer them to the standards body’s website to confirm it"],"Compliance is specific to the product. Do not confirm it from memory or by category."),Q("Products","A customer says they need “a better box.” What do you ask first?",["What they ship, its weight, and what is going wrong now","What they currently pay per box, including freight","Whether they would like to see the heavy-duty corrugated line","How many boxes they use each month, and in which sizes"],"The other questions become useful later. You cannot recommend anything until you understand the application and the failure."),Q("Products","What does ECT measure on a corrugated box?",["Edge crush: how much stacking load the board can take","Burst strength: the pressure needed to puncture the wall","Moisture resistance of the outer liner","The recycled content of the board"],"ECT is the edge crush test and relates to stacking strength. 32 ECT is the common single-wall standard. The older Mullen test measures burst strength."),Q("Products","Box dimensions are listed as 12 × 10 × 8. What do those numbers mean?",["Inside length, width and height, in that order","Outside length, width and height, in that order","Inside height, width and length, in that order","Outside width, length and height, in that order"],"Boxes are specified by inside dimensions, length × width × height, because what matters is what fits."),Q("Products","A customer stores sealed cartons for a year in a warehouse with wide temperature swings. Which tape adhesive suits that best?",["Acrylic","Hot melt","Natural rubber","Any of them; adhesive does not affect storage life"],"Acrylic holds over time and across a wide temperature range. Hot melt grabs quickly and suits general carton sealing. Natural rubber sticks well to recycled or dusty cartons."),Q("Products","Poly bag thickness is given in mils. What is one mil?",["One thousandth of an inch","One millimeter","One hundredth of an inch","One micron"],"A 2 mil bag is a common standard weight, 4 mil is heavy duty and 6 mil is extra heavy."),Q("Products","What is the difference between cushioning and void fill?",["Cushioning absorbs shock; void fill stops items moving in the box","Cushioning is paper-based; void fill is plastic-based","Cushioning is for heavy items; void fill is for light items","There is no practical difference between the two"],"Bubble and foam cushion a product. Kraft paper and air pillows fill empty space. A fragile item often needs both."),Q("Products","A customer needs inventory labels that stay readable for several years. Which print method fits?",["Thermal transfer, which uses a ribbon","Direct thermal, which uses heat-sensitive paper","Either, since both last equally long","Neither; they need laser-printed labels"],"Direct thermal labels fade with heat, light and time, which is fine for a shipping label. Thermal transfer uses a ribbon and lasts much longer."),Q("Products","Which strapping is commonly used in place of steel on heavy palletized loads?",["Polyester","Polypropylene","Twine","Stretch film"],"Polyester holds tension on heavy loads and is safer to handle than steel. Polypropylene suits light to medium bundling. Steel remains the choice for the heaviest, sharp-edged or hot loads."),Q("Sales judgment","A buyer says, “Your price is higher.” What is the best first response?",["Ask what is being compared: specification, quantity, freight","Explain the service advantages that justify the price difference","Ask what price they need, and take that figure to your manager","Offer to match the price on their single highest-volume item"],"Until you know the comparison is like for like, you do not know whether there is a price gap at all."),Q("Sales judgment","A prospect says, “We are happy with our supplier.” What is a good next move?",["Ask whether a second source for one item would help","Ask when their current contract ends, and call back then","Offer a side-by-side review of their whole supply spend","Leave a catalog with them and follow up in about a month"],"A small, specific request is easier to accept than a broad review, and it respects the existing relationship."),Q("Sales judgment","A customer’s order is late and you do not yet know why. What do you do first?",["Call them, ask what is most urgent, check status, and set a call-back time","Wait until you have the full explanation, so that you only need to call once","Send them the carrier’s tracking number and its customer service line","Tell them it should arrive tomorrow, based on normal transit times for the lane"],"Call before you have the full answer. Give a time for your next update, and do not give a delivery date you cannot confirm."),Q("Sales judgment","Your contact likes your proposal but cannot approve purchases. What is the best next step?",["Ask how purchases are approved, and offer to help involve the approver","Email the proposal directly to their manager, which saves everyone time","Log it as a committed deal, since the person using the product supports it","Wait for the contact to come back to you once they have secured approval"],"Going around your contact damages the relationship, and waiting gives you no say in the decision. Ask how approval works and help them make the case."),Q("Sales judgment","A prospect is friendly and asks for a catalog, but names no need and agrees no next step. How should you forecast it?",["Log the call; forecast nothing until there is a need and a next step","Forecast a small first order, since asking for a catalog shows intent","Forecast their estimated annual spend, at a low probability of closing","Close it out as lost, since no need or next step was agreed"],"A catalog request shows interest and nothing more. It is worth another conversation, but it does not belong in a revenue forecast."),Q("Sales judgment","You have a fixed prospect appointment in 20 minutes. An existing account calls about a stockout, and support can investigate immediately. What do you do?",["Call the account, start support on it, set a call-back time, and keep the appointment for now","Drive to the account straight away, because existing customers should always come first","Keep the appointment as planned, and deal with the account’s stockout once it is finished","Cancel the appointment and spend the day resolving the stockout with the account in person"],"Establish the facts before you travel. You can protect the account through support and clear communication while keeping your other commitment."),Q("Sales judgment","Which visit note is most useful to you and your manager?",["Need, evidence, decision-makers, next step and date","A full chronological record of what was said in the meeting","The products discussed, and the customer’s reaction to each one","Estimated annual spend, and your probability of winning it"],"A good note lets anyone pick up the account and know what happens next."),Q("Sales judgment","You are calling a business you know little about. Which opening is strongest?",["Say who you are, ask for thirty seconds, give one reason, ask one question","Open with a statistic about packaging waste in their industry, then ask about theirs","Ask for a 30-minute meeting so that you can introduce Uline’s full product range","Ask who handles purchasing, then request their email so you can send a catalog"],"Ask permission, be brief, and do not assume a problem you have not confirmed."),Q("Sales judgment","A buyer agrees that a product trial might help. What makes it lead to a decision?",["Agreeing the baseline, the success measure, who judges it, and a review date","Sending samples promptly and following up with the buyer in two weeks","Quoting the full conversion up front, so they can see the savings at scale","Letting the customer define success once they have used the product for a while"],"If nobody agrees in advance what counts as success, the trial usually ends with no decision."),Q("Sales judgment","After a fair comparison, the competitor is cheaper and the buyer has no unmet need. What do you do?",["Say so, thank them, and agree when to check in again","Ask for a small order so that the account shows as active","Request a price exception from your manager to win the business","Propose a product trial to look for performance differences"],"Saying so keeps your credibility with the buyer, which matters the next time they have a need."),Q("Sales judgment","A customer who orders on the website asks why they should meet with you. What is the best response?",["Ask whether any packing or supply problem would justify ten minutes","Offer to place their orders for them, so they have a single point of contact","Show them some website features that they may not be using yet","Set up a regular monthly visit to review their order history with them"],"Support the way they buy, and offer something the website cannot provide."),Q("Sales judgment","No account has an urgent issue. Which one is the best candidate for your next discovery visit?",["A mid-sized account with a stated need and an available buyer","Your largest account, although nobody there is free to meet","The account that happens to be closest to today’s route","An account that has never bought from your strongest category"],"Size and location matter, but a stated need and access to the buyer give you a reason to meet."),Q("Sales judgment","Revenue on your account rose, but you cannot separate your effect from a general increase in the customer’s buying. How do you present it?",["Give the measured change, what you did, and what you cannot attribute","Claim the full increase, since it happened while you managed the account","Leave the number out altogether, since you cannot prove causation","Quote the best single month, which shows your effect most clearly"],"Expect follow-up questions about how much of the result was yours. A claim you have limited honestly will hold up. An inflated one will not."),Q("Sales judgment","A receptionist will not connect you to purchasing. What is the professional next step?",["Ask how purchasing prefers to be contacted, and follow that","Call back at lunchtime, when someone else may answer the phone","Ask a warehouse employee for the buyer’s direct phone line","Send a calendar invitation to your best guess at their email address"],"Going around the receptionist usually gets back to the buyer, and it can cost you the account."),Q("Numbers","An item costs $75 and sells for $100. What is the gross margin?",["25%","33.3%","75%","20%"],"Margin is profit divided by selling price: $25 ÷ $100. Dividing by cost gives the markup, 33.3%."),Q("Numbers","An item costs $75 and sells for $100. What is the markup on cost?",["33.3%","25%","75%","133.3%"],"Markup is profit divided by cost: $25 ÷ $75. Margin divides by price and gives 25%."),Q("Numbers","A damage rate falls from 2.0% to 1.4%. Which description is correct?",["A 0.6 percentage-point drop, a 30% reduction","A 0.6% reduction in the damage rate","A drop of 6 percentage points in damage","A 70% reduction in the damage rate"],"2.0 minus 1.4 is 0.6 percentage points. Relative to the starting rate, 0.6 ÷ 2.0 is 30%. State which one you mean."),Q("Numbers","An account grows from $400,000 to $460,000. All prices rose 10% and the mix did not change. What was the volume growth?",["About 4.5%","15%","5%","10%"],"Revenue rose 15%. Removing the price effect: 1.15 ÷ 1.10 = 1.045, so volume rose about 4.5%."),Q("Numbers","You contacted 40 prospects, qualified 16, and won 8. How should you report conversion?",["20% of contacted and 50% of qualified","50%, since qualified prospects are the fair base","20%, since contacted prospects are the fair base","35%, the average of the two conversion rates"],"Both rates are valid. A conversion figure without its denominator invites a follow-up question you would rather answer up front."),Q("Numbers","Your quote is $500 plus $65 freight. A competitor’s is $540 plus $10 freight, for the same goods. Which is cheaper delivered?",["The competitor, by $15","Yours, by $40","Yours, by $15","The competitor, by $55"],"$565 against $550. Always compare delivered totals."),Q("Numbers","23 of 80 prospects converted. What is the rate, to one decimal place?",["28.8%","28.7%","28.75%","29.0%"],"23 ÷ 80 = 28.75%, which rounds up to 28.8%."),Q("Interview technique","What does STAR stand for?",["Situation, Task, Action, Result","Summary, Target, Approach, Review","Situation, Timeline, Analysis, Result","Strategy, Task, Action, Reflection"],"It is the standard structure for behavioral interview answers."),Q("Interview technique","In a two-minute STAR answer, which part should take the most time?",["Action","Situation","Task","Result"],"Interviewers are assessing what you did. Keep the situation and task to a few sentences."),Q("Interview technique","You are asked about a target you missed. Which approach is strongest?",["State the gap, your part in it, what you changed, and what followed","Explain the market conditions that caused the target to be missed","Choose a miss where responsibility mainly sat with someone else","Choose a near miss, so that the gap you describe is small"],"The interviewer wants to see that you own the result and changed something. A real miss with a clear change is more convincing than one you have played down."),Q("Interview technique","You have no directly comparable example for a question. What should you do?",["Use a real example from another setting, and say what differs","Describe in detail what you would do if you faced that situation","Adapt a colleague’s example that you know well enough to describe","Say that you have not faced that situation, and move to the next question"],"A real example that transfers is stronger than a hypothetical. Never present someone else’s work as your own."),Q("Interview technique","How should you approach a work-style or personality questionnaire?",["Answer honestly and consistently","Choose the most assertive option each time","Answer as you imagine the ideal salesperson would","Choose the middle option when unsure"],"These questionnaires often repeat items in different words to check consistency, and an invented persona is hard to maintain."),Q("Interview technique","Which is the strongest final question to ask an interviewer?",["Whether anything in your background gives them pause, then next steps","When you can expect to receive an offer if things go well","How you compare with the other candidates they are seeing","None, as a way of showing respect for the interviewer’s time"],"It gives you a chance to address a concern while you are still in the room.")],C.quiz=C.quiz.filter(e=>"Company and role"===e.c||"Products"===e.c).concat([Q("Company and role","Uline’s mission statement ends with delivering every order with which three things?",["Speed, passion and operational excellence","Quality, value and integrity","Service, selection and savings","People, products and performance"],"The same three words head the mission section of Uline’s careers site."),Q("Company and role","Complete the line from Uline’s careers site: “Great service means worrying about ___ so our customers don’t have to.”",["the details","the price","the freight","the paperwork"],"It explains why the hiring process tests for accuracy."),Q("Company and role","What is the Uline guarantee?",["Try any product for 30 days, or return it for a refund","A 90-day warranty on Uline-brand products only","A price match against any competitor’s written quote","Free return shipping for one year on unopened cases"],"It is one of six selling points on Uline’s “Why Uline” page, and it is useful against a price objection."),Q("Company and role","Which of these is not one of the six selling points on Uline’s “Why Uline” page?",["Lowest price guaranteed","Same day shipping","Huge catalog","Low shipping costs"],"The six are: huge catalog, customer service, same-day shipping, low shipping costs, quality products and the Uline guarantee. Uline does not claim to be the cheapest."),Q("Company and role","According to Uline’s website, who holds which role?",["Liz Uihlein is CEO; Dick Uihlein is Chairman of the Board","Dick Uihlein is CEO; Liz Uihlein is Chairman of the Board","Both have retired; their son Brian is CEO","Liz Uihlein is head of sales; Dick Uihlein is CEO"],"The company history page lists the family’s roles. Several of their children are vice presidents."),Q("Company and role","How do Uline’s other Sales Account Manager postings describe the core customer activity?",["Annual customer consultations with existing accounts","Weekly order-taking calls to every account","Quarterly business reviews held by video","Selling at trade shows and hiring events"],"The Dallas and Boston postings say: “Provide effective solutions at annual customer consultations from our catalog.”"),Q("Company and role","Which bonuses does Uline’s careers site list?",["Performance bonus, sales goal bonus, profit sharing","Uncapped commission on every order in the territory","Stock options and a signing bonus for sales hires","A quarterly commission plus a car allowance"],"Reps confirm it is salary plus bonuses, not commission."),Q("Company and role","According to Uline’s posting for the Allentown Sales Manager, how large is that manager’s team?",["8 to 10 representatives","3 to 5 representatives","20 to 25 representatives","It varies by quarter and is not stated"],"The same posting says the manager is in the office Monday and Friday and in the field on joint calls Tuesday to Thursday."),Q("Company and role","What does that same posting call the foundation of Uline’s sales culture?",["Strong customer relationships built on trust","Aggressive acquisition of new accounts","Having the lowest price in the market","A high daily volume of cold calls"],"Use the phrase, or the idea, when you answer “Why sales?” and “Why Uline?”"),Q("Company and role","What do Uline reps say makes a customer visit successful?",["Listening, taking notes and touring the customer’s warehouse","Presenting the catalog to the buyer page by page","Opening with a discount to start the conversation","Keeping every visit to under five minutes"],"From a rep’s review: growth comes from visiting each customer once or twice a year and finding what they buy elsewhere."),Q("Company and role","What do reps say happens to the notes from each customer visit?",["They are entered on a company device the same day","They are optional for smaller accounts","They are written up once a week, on Monday","Sales support writes them from the rep’s voicemail"],"Several reps mention daily notes and activity reports. Expect questions about how you keep records."),Q("Company and role","Where did Uline open its East Coast distribution center in September 2022?",["Lower Macungie Township, near the Allentown branch","The Philadelphia Navy Yard","Harrisburg, Pennsylvania","Newark, New Jersey"],"It was Uline’s first distribution center outside the Midwest, built to speed up delivery in the Northeast."),Q("Company and role","What do candidates report about dress at Uline interviews?",["Business professional: a suit, at every stage","Business casual is fine after the first round","A Uline-branded polo is provided","There is no stated expectation"],"Uline has said its dress code “helps us ensure a consistent level of professionalism across the company.”"),Q("Company and role","About how many box sizes does Uline say it stocks?",["More than 1,700","About 170","About 400","More than 17,000"],"From Uline’s own company description."),Q("Company and role","Which two timed tests do candidates most often report at the on-site stage?",["Number matching and number patterns","Typing speed and grammar","Mechanical reasoning and spatial puzzles","Excel formulas and mail merge"],"Both are reported at about four minutes each. Practice them under Assessment practice.")]),C.quiz.forEach(e=>{let t=0;for(const o of e.q)t=31*t+o.charCodeAt(0)>>>0;e.id="q"+t.toString(36)}),C.dayFields=[["when","Date and time","Day, date and time. Plan to arrive 15 minutes early."],["where","Location or video link","Address and entrance, or the meeting link"],["who","Interviewers","Names and titles, if known"],["contact","Recruiter’s name and phone number","In case you are delayed"],["format","Format confirmed by the recruiter","Length, assessments, what to bring. Leave blank until confirmed."]],C.documents=["Several printed copies of your résumé","The paper application, completed, if you were sent one","Full work history with exact dates, and each supervisor’s name and contact details","References. One candidate gave three professional references; another was asked for two supervisors and a coworker.","A copy of your diploma or transcript","Driver’s license","A notepad and pen"],C.before=["Time, location and recruiter contact confirmed","Route checked, or video link tested","Business professional outfit ready (candidates report that a suit is expected)","Documents packed","Both main examples rehearsed aloud once","Three questions chosen","Phone charged"],C.morning=["Plan to arrive 15 minutes early.","On the timed tests, read the instructions fully before you start. Candidates say you are not expected to finish, so work accurately.","If you need a moment before answering, say so. A short pause is normal in a structured interview.","Expect several conversations in a row. Give each interviewer a complete answer, even if you covered the same ground with the previous one."],C.ridealong=["Treat it as part of the interview. The rep will be asked for their impression of you.","Dress as you would for the interview unless told otherwise.","Let the rep lead with customers. Observe, and save your questions for the car.","Useful questions: how they plan their Monday, how they divide time between existing accounts and prospecting, what customers call about most often, and what they found hardest in their first six months.","Afterwards, send a short thank-you to the rep as well as the manager."],C.after=["Write down who you met and what they asked while you still remember it.","Send a short thank-you the same day that refers to something specific from the conversation.","Note anything you promised to send, and send it."],C.phases={foundation:{name:"Foundation",tasks:[["read","Read Role and process","10 min","role"],["intro","Draft “Tell me about yourself” and “Why Uline”","15 min","answers","core"],["star1","Write your new-business example","15 min","answers","star"],["base","Baseline: one number matching round and one number patterns round","10 min","tests"]]},build:{name:"Build",tasks:[["star2","Write your account-growth example","15 min","answers","star"],["resume","Complete the résumé walkthrough","10 min","answers","resume"],["mock3","Mock interview: three questions from Background and motivation","12 min","mock"],["tests","Both timed tests, then review your errors","10 min","tests"],["primer","Read the product primer","8 min","primer"]]},rehearse:{name:"Rehearse",tasks:[["full","Full mock interview","25 min","mock"],["scen","One discovery conversation and one objection","10 min","scenarios","convo"],["write","One timed writing exercise","10 min","scenarios","case"],["quiz","One knowledge check round","5 min","quiz"],["math","One sales math round","6 min","tests"]]},practiceA:{name:"Practice",tasks:[["tests","Both timed tests, then review your errors","10 min","tests"],["mock2","Mock interview: two questions you have not practiced","10 min","mock"],["core","Refine one core answer until it fits the time target","8 min","answers","core"],["quiz","One knowledge check round","5 min","quiz"]]},practiceB:{name:"Practice",tasks:[["star","Write or improve one STAR example","12 min","answers","star"],["scen1","One discovery conversation or objection","8 min","scenarios","convo"],["math","One sales math round","6 min","tests"],["mock1","Mock interview: one role-play question","6 min","mock"]]},light:{name:"Light day",tasks:[["logistics","Confirm time, place and contact on the Interview day page","5 min","day"],["docs","Pack your documents and lay out your outfit","10 min","day"],["two","Say your two priority examples aloud, once each","8 min","mock"],["one","One timed round of a test you have already practiced","4 min","tests"],["asks","Choose the three questions you will ask, then stop for the day","3 min","role"]]},day:{name:"Interview",tasks:[["card","Read through your interview day card","5 min","day"],["early","Arrive 15 minutes early","",""],["thanks","Afterwards: write down what was asked and send your thank-you notes","10 min","day"]]},after:{name:"Follow-up",tasks:[["thanks","Send thank-you notes if you have not already","10 min","day"],["record","Write down who you met and what they asked","10 min","overview"]]}},C.core=[{id:"intro",t:"Tell me about yourself",target:90,mock:"intro",g:"Where you are now, the one or two experiences that matter most for a field sales role with account visits, and why you want this job. Most interviews open with this."},{id:"why",t:"Why Uline?",target:75,mock:"why",rep:!0,g:"Two or three reasons in Uline’s own terms, each tied to something you have done. Material: a territory of your own, on-site consultations with customers, same-day shipping and a 30-day guarantee you can stand behind, structured training and mentorship, a family-owned company, a fast-growing Allentown branch."},{id:"whysales",t:"Why sales?",target:60,mock:"whysales",rep:!0,g:"A concrete reason from your own experience. Uline’s sales culture is described as “strong customer relationships built on trust,” so a relationship example fits."},{id:"typicalday",t:"A typical day, and an average week",target:90,mock:"typicalday",rep:!0,g:"Asked at several Uline branches. Walk through it in order and show how you plan, record and follow up. Uline reps plan on Monday, visit Tuesday to Friday and log every call."},{id:"strength",t:"Greatest strength, and a weakness",target:90,mock:"strength",rep:!0,g:"A strength that matters here: reliability, attention to detail, building relationships. A real weakness, what you are doing about it, and evidence that it is improving."},{id:"prioritize",t:"Current customers or new business?",target:60,mock:"prioritize",rep:!0,g:"Asked of a candidate for this exact job title. The posting wants both. Explain how you protect time for each."},{id:"learn",t:"How would you learn our products?",target:60,mock:"learn",rep:!0,g:"Over 43,000 products in forty-plus categories. Mention the training and mentorship, the catalog, product tests, starting with what your accounts buy, and learning from customers."},{id:"fiveyears",t:"Where do you see yourself in five years?",target:60,mock:"fiveyears",rep:!0,g:"Reported at several branches. Uline emphasizes growing careers inside the company, so talk about growing a territory and earning more responsibility there."},{id:"motivates",t:"What motivates you?",target:45,mock:"motivates",rep:!0,g:"Be honest and specific. Pay here is salary plus goal-based bonuses and profit sharing, with team contests."}],C.plan90=[["w1","Weeks 1 to 4: training","What you want to learn, and how you will make the most of it. Products, systems, how orders and service work, and how strong reps plan their week."],["w2","Weeks 5 to 16: mentorship","Shadowing, meeting your existing accounts, learning the territory, starting to prospect with your mentor’s guidance, and agreeing priorities with your manager."],["w3","By the end of the mentorship","What you would expect to be doing independently. Avoid promising revenue figures before you have seen the territory’s baseline."]],C.resumeFields=[["role","Employer and title","Keystone Packaging, Account Executive"],["dates","Dates","March 2021 to present"],["did","What you did, in one sentence","Managed 60 accounts across two counties and prospected for new business"],["result","One result","Grew the book from $1.1M to $1.4M in two years"],["left","Reason for leaving","Brief, factual and consistent with your application"]],C.primerIntro="Uline lists more than forty product categories, and reps describe product-knowledge tests. A rep’s growth comes from customers who buy one category and do not realize Uline stocks the rest.",C.categories=[["Shipping and packaging","Corrugated boxes, mailers and envelopes, tape and 3M tape, stretch and shrink wrap, bubble and foam cushioning, poly bags, strapping, edge protectors, labels, tags, packing list envelopes, tubes"],["Warehouse","Material handling, shelving and storage, bins and totes, carts, workbenches and packing tables, warehouse equipment, mats, drums and pails"],["Facility and safety","Janitorial supplies, facilities maintenance, gloves, personal protective equi
