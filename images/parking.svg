<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" role="img" aria-labelledby="title desc">
  <title id="title">Parking process on the square lattice</title>
  <desc id="desc">Three random-walk trajectories connect moving cars to free parking spots over an odometer field.</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111522"/><stop offset="1" stop-color="#24192c"/>
    </linearGradient>
    <radialGradient id="visit" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d85f82" stop-opacity=".72"/><stop offset="1" stop-color="#d85f82" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#d7cfbe" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="560" height="560" rx="18" fill="url(#ground)"/>
  <g fill="url(#visit)">
    <circle cx="153" cy="365" r="106"/><circle cx="342" cy="202" r="125"/><circle cx="430" cy="405" r="88"/>
  </g>
  <rect x="40" y="40" width="480" height="480" fill="url(#grid)"/>
  <g fill="none" stroke="#68c7ea" stroke-width="4" opacity=".95">
    <circle cx="80" cy="120" r="11"/><circle cx="240" cy="80" r="11"/><circle cx="480" cy="160" r="11"/>
    <circle cx="400" cy="480" r="11"/><circle cx="120" cy="440" r="11"/><circle cx="280" cy="320" r="11"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4">
    <path d="M80 400h40v-80h40v-40h80v40h40" stroke="#f5c451"/>
    <path d="M440 80v80h-40v40h-80v80h-40v40" stroke="#f09a55"/>
    <path d="M480 400h-40v40h-80v-40h-40v-80h-40" stroke="#f3d875"/>
  </g>
  <g fill="#f5c451" stroke="#111522" stroke-width="4">
    <circle cx="80" cy="400" r="13"/><circle cx="440" cy="80" r="13"/><circle cx="480" cy="400" r="13"/>
  </g>
  <g fill="#68c7ea" stroke="#111522" stroke-width="3">
    <circle cx="280" cy="320" r="10"/><circle cx="400" cy="480" r="10"/>
  </g>
</svg>
